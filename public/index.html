  <meta http-equiv="Content-Language" content="en" />

  <title>xqueue</title>

  <meta name="apple-mobile-web-app-title" content="xqueue" />
  <style>

    }
    :root {
      --bg: #0e1113;
      --panel: #171b1f;
      --panel-2: #1f252a;
      --border: #2a3138;
      --text: #e7edf2;
      --muted: #8a97a3;
      --accent: #1d9bf0;
      --accent-dim: #17517a;
      --danger: #e0555a;
      --ok: #2ecc71;
    }
    * { box-sizing: border-box; }
    /* The [hidden] attribute must always win — author display rules (flex/grid)
       would otherwise override the UA [hidden]{display:none} and leave elements
       stuck visible. This guards every hideable element (login, modal, lists). */
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      /* 16px base so text inputs never trigger iOS focus-zoom (they use font:inherit). */
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Belt-and-suspenders: any focusable text field stays >=16px on iOS. */
    textarea, input, select { font-size: 16px; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }

    .login-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); padding: 24px;
    }
    /* The display:flex above would otherwise override the [hidden] attribute,
       leaving the overlay stuck on screen after a successful unlock. */
    .login-overlay[hidden] { display: none; }
    .login-box {
      width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px;
    }
    .login-box h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
    .login-sub { margin: 0; color: var(--muted); font-size: 13px; }
    .login-box input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text); outline: none;
    }
    .login-box input:focus { border-color: var(--accent-dim); }
    .login-box button { width: 100%; padding: 12px; }
    .login-error { margin: 0; color: var(--danger); font-size: 13px; min-height: 1em; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    header h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
    /* Wordmark: Space Grotesk Bold, white. */
    .logo { font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    header .usage { font-size: 12px; color: var(--muted); text-align: right; }
    .lockbtn { background: transparent; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); padding: 5px 11px; font-size: 12px; line-height: 1; white-space: nowrap; }
    .lockbtn:hover { color: var(--text); border-color: var(--accent-dim); }

    .composer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    textarea {
      width: 100%; min-height: 84px; resize: vertical;
      background: transparent; border: 0; color: var(--text);
      font: inherit; outline: none;
    }
    .composer-bottom { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .count.over { color: var(--danger); }
    .cost { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cost.link { color: var(--danger); }
    .tab-summary { font-size: 12px; color: var(--muted); margin: -4px 2px 12px; font-variant-numeric: tabular-nums; }
    /* Randomise button lives on the tabs row: pushed right, vertically centered
       against the taller tab buttons (which define the row height). */
    #shuffleQueue { margin-left: auto; align-self: center; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
    .spacer { flex: 1; }
    button {
      font: inherit; cursor: pointer; border-radius: 999px;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      padding: 6px 14px; transition: background .12s, border-color .12s;
    }
    button:hover { border-color: var(--accent-dim); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button:disabled, button.primary:disabled, button.btn-secondary:disabled {
      opacity: .4; cursor: not-allowed;
    }
    button:disabled:hover { border-color: var(--border); }

    .controls {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin: 14px 2px 0;
    }
    .cadence { display: flex; flex-direction: column; gap: 6px; }
    .ctl-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .intervals { display: flex; gap: 5px; flex-wrap: wrap; }
    .intervals button { padding: 7px 11px; font-size: 14px; min-width: 40px; }
    .intervals button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .btn-secondary { background: var(--panel); padding: 8px 14px; font-size: 14px; }
    .btn-secondary:hover { border-color: var(--accent-dim); color: var(--text); }
    /* On narrow screens the Bulk import button wraps below the interval row;
       give it explicit spacing (flex gap isn't reliable cross-axis on older iOS). */
    @media (max-width: 520px) {
      #importToggle { margin-top: 12px; }
      /* On phones the tabs row is tight, so Randomise sheds its button chrome and
         shows as a bare shuffle icon (matching the row-action iconbtns). */
      #shuffleQueue { background: transparent; border: 0; color: var(--muted); padding: 4px 6px; font-size: 18px; }
      #shuffleQueue:hover { color: var(--text); }
      #shuffleQueue .lbl { display: none; }
      /* Import panel: split choice on its own full row, file picker next,
         then the count + action buttons on a clean bottom row. */
      .split-group { flex-basis: 100%; }
      .import-bar .spacer,
      .review-bar .spacer { flex-basis: 100%; height: 0; margin: 0; }
      .import-bar button,
      .review-bar button { padding: 8px 16px; font-size: 14px; }
      /* Queued + review-deck posts on mobile: stack full-width, hide action bar
         until the row is tapped, then reveal it across the full width. */
      .item { flex-direction: column; align-items: stretch; }
      .item .body { width: 100%; } /* ensure text + edit textarea span the row */
      .item.queued .body,
      .item.review-row .body { cursor: pointer; }
      .item.queued .item-actions,
      .item.review-row .item-actions { display: none; }
      .item.queued.expanded .item-actions,
      .item.review-row.expanded .item-actions {
        display: flex; width: 100%; gap: 8px;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
      }
      .item.queued.expanded .item-actions .iconbtn,
      .item.review-row.expanded .item-actions .iconbtn {
        flex: 1; border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 0; font-size: 18px;
      }
      .item.queued.expanded .item-actions .iconbtn.send { border-color: var(--accent-dim); }
    }
    .import-panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; margin-top: 8px;
    }
    .import-panel textarea {
      width: 100%; min-height: 120px; resize: vertical;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font: inherit; padding: 8px; outline: none;
    }
    .import-panel textarea:focus { border-color: var(--accent-dim); }
    /* Shared seed-bar styles for Bulk import + Review (identical type scale). */
    .import-bar,
    .review-bar { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    .split-group { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
    .split-options { display: flex; align-items: center; gap: 16px; flex-wrap: nowrap; }
    .split-label { font-size: 14px; color: var(--muted); white-space: nowrap; }
    .import-bar .split,
    .review-bar .split {
      font-size: 14px; color: var(--text); display: flex; align-items: center;
      gap: 5px; cursor: pointer; white-space: nowrap;
    }
    .file-label {
      font-size: 14px; color: var(--accent); cursor: pointer;
      border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
    }
    .file-label:hover { border-color: var(--accent-dim); }
    .import-bar .count,
    .review-bar .count { font-size: 14px; }
    .import-bar .count.over,
    .review-bar .count.over { color: var(--danger); }
    .import-bar button,
    .review-bar button { padding: 6px 14px; font-size: 14px; }

    .controls-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    @media (max-width: 520px) {
      #reviewToggle { margin-top: 12px; }
    }
    .review-panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; margin-top: 8px;
    }
    .review-panel textarea {
      width: 100%; min-height: 120px; resize: vertical;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font: inherit; padding: 8px; outline: none;
    }
    .review-panel textarea:focus { border-color: var(--accent-dim); }
    .review-deck-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin: 16px 2px 8px; flex-wrap: wrap;
    }
    .review-deck-head .label {
      font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
    }
    .review-deck-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .review-deck-actions button { padding: 5px 12px; font-size: 13px; }
    .review-list { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
    .review-list .item.over { border-color: #5c2a2c; }
    .review-list .item .char-meta { font-variant-numeric: tabular-nums; }
    .review-list .item .char-meta.over { color: var(--danger); }

    /* Full-screen Review swipe mode */
    .review-swipe {
      position: fixed; inset: 0; z-index: 40;
      display: flex; flex-direction: column;
      background: var(--bg); padding: 16px 16px 24px;
    }
    .review-swipe[hidden] { display: none; }
    .swipe-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      max-width: 520px; width: 100%; margin: 0 auto 12px;
      position: relative; z-index: 6; flex-shrink: 0;
    }
    .swipe-top .progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .swipe-top button {
      min-height: 44px; min-width: 72px; padding: 10px 16px; font-size: 15px;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      position: relative; z-index: 7;
    }
    .swipe-stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      max-width: 520px; width: 100%; margin: 0 auto; min-height: 0; position: relative;
      cursor: default;
    }
    .swipe-card {
      width: 100%; max-height: 100%;
      background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
      padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,.35);
      transition: transform .22s ease, opacity .22s ease, border-color .15s, background .15s;
      /* none so horizontal swipes aren't stolen by the browser; scrolling is via the text area */
      touch-action: none;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .swipe-card.editing { touch-action: auto; user-select: text; -webkit-user-select: text; }
    .swipe-card.out-left { transform: translateX(-120%) rotate(-8deg); opacity: 0; }
    .swipe-card.out-right { transform: translateX(120%) rotate(8deg); opacity: 0; }
    .swipe-card.flash-ok { border-color: #1f5c3a; background: #14241c; }
    .swipe-card.flash-no { border-color: #5c2a2c; background: #241416; }
    @keyframes cardInFromBelow {
      from { transform: translateY(36px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .swipe-card.enter-below {
      animation: cardInFromBelow .28s ease;
    }
    .swipe-card .card-text {
      flex: 1; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word;
      font-size: 18px; line-height: 1.45; min-height: 120px;
      cursor: pointer; -webkit-overflow-scrolling: touch;
      touch-action: pan-y; /* allow reading long posts by scrolling text */
    }
    .swipe-card .card-edit {
      flex: 1; width: 100%; min-height: 140px; resize: vertical;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font: inherit; font-size: 17px; padding: 12px; outline: none;
      touch-action: auto;
    }
    .swipe-card .card-edit:focus { border-color: var(--accent-dim); }
    .swipe-card .card-meta {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums;
    }
    .swipe-card .card-meta .count.over { color: var(--danger); font-weight: 600; }
    .swipe-card .card-meta .warn { color: var(--danger); font-size: 12px; }
    .swipe-card .edit-bar { margin-top: 0; }
    .swipe-card .edit-bar .count.over { color: var(--danger); }
    .swipe-actions {
      display: flex; align-items: center; justify-content: center; gap: 18px;
      max-width: 520px; width: 100%; margin: 18px auto 0; flex-wrap: wrap;
      position: relative; z-index: 6; flex-shrink: 0;
    }
    .swipe-actions button {
      min-width: 64px; min-height: 64px; border-radius: 999px; font-size: 22px; padding: 12px 18px;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    .swipe-actions .rej { border-color: #5c2a2c; color: var(--danger); }
    .swipe-actions .rej:hover:not(:disabled) { background: #2a1416; border-color: var(--danger); }
    .swipe-actions .acc { background: var(--ok); border-color: var(--ok); color: #0e1113; font-weight: 700; }
    .swipe-actions .acc:hover:not(:disabled) { filter: brightness(1.08); }
    .swipe-actions .acc:disabled { opacity: .35; }
    .swipe-hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 12px; }
    .swipe-empty {
      text-align: center; color: var(--muted); padding: 40px 16px;
    }
    .swipe-empty h2 { color: var(--text); margin: 0 0 8px; font-size: 20px; }
    .badge-count {
      display: inline-block; min-width: 1.4em; padding: 0 6px; margin-left: 4px;
      border-radius: 999px; background: var(--accent); color: #fff;
      font-size: 11px; font-weight: 700; line-height: 1.6; vertical-align: middle;
    }

    .next-line { font-size: 12px; color: var(--muted); margin: 14px 2px 8px; }
    .next-line b { color: var(--text); font-weight: 600; }

    .list { display: flex; flex-direction: column; gap: 8px; }
    .list[hidden] { display: none; } /* author display:flex would otherwise beat [hidden] */
    .item {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
    }
    .item.next { border-color: var(--accent-dim); box-shadow: 0 0 0 1px var(--accent-dim) inset; }
    .item .body { flex: 1; min-width: 0; }
    .item .txt { white-space: pre-wrap; word-wrap: break-word; }
    .item .meta { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); }
    .badge.next { color: var(--accent); border-color: var(--accent-dim); }
    .badge.posted { color: var(--ok); border-color: #1f5c3a; }
    .badge.failed { color: var(--danger); border-color: #5c2a2c; }
    /* Desktop: compact icon buttons on the right, vertically centered in the row. */
    .item-actions { display: flex; gap: 2px; align-items: center; align-self: center; }
    .iconbtn { color: var(--muted); border: 0; background: transparent; padding: 2px 6px; font-size: 15px; line-height: 1; }
    .iconbtn:hover:not(:disabled) { color: var(--text); }
    .iconbtn:disabled { opacity: .25; cursor: default; }
    .iconbtn.send { color: var(--accent); }
    .iconbtn.send:hover { color: #fff; }
    .del:hover:not(:disabled) { color: var(--danger); }
    .edit-area {
      display: block; width: 100%; min-height: 92px; resize: vertical;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font: inherit; font-size: 16px; padding: 8px; outline: none;
    }
    .edit-area:focus { border-color: var(--accent-dim); }
    .edit-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .edit-bar .spacer { flex: 1; }
    .edit-bar button { padding: 4px 12px; font-size: 13px; }

    .section-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 26px 2px 10px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 22px 0 12px; }
    .tab { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 9px 14px; font-size: 15px; margin-bottom: -1px; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .empty { color: var(--muted); font-size: 14px; padding: 24px 4px; text-align: center; }
    /* "Load more" tile — same footprint as a post, dashed blue outline that
       (with its text) brightens to the accent on hover. */
    .load-more {
      display: flex; align-items: center; justify-content: center;
      min-height: 62px; padding: 12px 14px;
      background: transparent;
      border: 1px dashed var(--accent-dim); border-radius: 12px;
      color: var(--muted); font-size: 14px;
      cursor: pointer; user-select: none;
      transition: border-color .12s, color .12s;
    }
    .load-more:hover { border-color: var(--accent); color: var(--accent); }
    a { color: var(--accent); }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55); padding: 24px;
    }
    .modal-overlay[hidden] { display: none; } /* author display:flex would beat [hidden] otherwise */
    .modal-box {
      width: 100%; max-width: 380px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-title { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
    .modal-body {
      margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.45;
      white-space: pre-wrap; word-wrap: break-word;
      max-height: 40vh; overflow-y: auto;
    }
    .modal-body.quote {
      color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-actions button { padding: 8px 16px; font-size: 14px; }
    .modal-actions .danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-overlay" id="login" hidden>
    <form class="login-box" id="loginForm">
      <h1 class="logo">xqueue</h1>
      <p class="login-sub">Enter your passphrase to continue</p>
      <input type="password" id="loginInput" autocomplete="current-password"
             placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button type="submit" class="primary" id="loginBtn">Unlock</button>
      <p class="login-error" id="loginError" hidden></p>
    </form>
  </div>

  <div class="wrap">
    <header>
      <h1 class="logo">xqueue</h1>
      <div class="header-right">
        <span class="usage" id="usage"></span>
        <button class="lockbtn" id="lockBtn" title="Lock (sign out)" aria-label="Lock">🔒 Lock</button>
      </div>
    </header>

    <div class="composer">
      <textarea id="text" placeholder="What's happening? (Enter to queue, Shift+Enter for newline)"></textarea>
      <div class="composer-bottom">
        <span class="count" id="count">0 / 280</span>
        <span class="cost" id="costEst"></span>
        <span class="spacer"></span>
        <button class="btn-secondary" id="postNow">Post now</button>
        <button class="primary" id="add">Queue</button>
      </div>
    </div>

    <div class="controls">
      <div class="cadence">
        <span class="ctl-label" id="cadenceLabel">Interval (whole queue)</span>
        <div class="intervals" id="intervals"></div>
      </div>
      <div class="controls-actions">
        <button id="importToggle" class="btn-secondary">⇪ Bulk import</button>
        <button id="reviewToggle" class="btn-secondary">✂ Review<span class="badge-count" id="reviewBadge" hidden>0</span></button>
      </div>
    </div>

    <div class="import-panel" id="importPanel" hidden>
      <textarea id="importText" placeholder="Paste many posts here — or choose a .txt / .md / .csv file below.&#10;&#10;Separate each post with a blank line (this lets a post span multiple lines)."></textarea>
      <div class="import-bar">
        <div class="split-group">
          <span class="split-label">Separate posts by</span>
          <span class="split-options">
            <label class="split"><input type="radio" name="split" value="blank" checked> blank line</label>
            <label class="split"><input type="radio" name="split" value="line"> one per line</label>
          </span>
        </div>
        <label class="file-label">Choose file<input type="file" id="importFile" accept=".txt,.md,.csv,text/plain" hidden></label>
        <span class="spacer"></span>
        <span class="count" id="importCount">0 posts</span>
        <button id="importCancel">Cancel</button>
        <button class="primary" id="importAdd" disabled>Add all</button>
      </div>
    </div>

    <div class="review-panel" id="reviewPanel" hidden>
      <textarea id="reviewText" placeholder="Paste posts to review one-by-one — or choose a .txt / .md / .csv file.&#10;&#10;Accept queues immediately; reject discards. Leave anytime and pick up where you left off."></textarea>
      <div class="review-bar">
        <div class="split-group">
          <span class="split-label">Separate posts by</span>
          <span class="split-options">
            <label class="split"><input type="radio" name="reviewSplit" value="blank" checked> blank line</label>
            <label class="split"><input type="radio" name="reviewSplit" value="line"> one per line</label>
          </span>
        </div>
        <label class="file-label">Choose file<input type="file" id="reviewFile" accept=".txt,.md,.csv,text/plain" hidden></label>
        <span class="spacer"></span>
        <span class="count" id="reviewSeedCount">0 posts</span>
        <button id="reviewCancel">Cancel</button>
        <button class="primary" id="reviewSeed" disabled>Add to review</button>
      </div>
      <div id="reviewDeckSection" hidden>
        <div class="review-deck-head">
          <span class="label" id="reviewDeckLabel">Deck</span>
          <div class="review-deck-actions">
            <button id="reviewEmpty" class="btn-secondary">Empty deck</button>
            <button class="primary" id="reviewContinue">Continue reviewing</button>
          </div>
        </div>
        <div class="review-list" id="reviewList"></div>
      </div>
    </div>

    <div class="next-line" id="next"></div>

  <!-- Review swipe overlay (outside .wrap so it covers the full viewport) -->
  <div class="review-swipe" id="reviewSwipe" hidden>
    <div class="swipe-top">
      <button id="swipeClose" class="btn-secondary">Done</button>
      <span class="progress" id="swipeProgress">0 left</span>
      <button id="swipeUndo" class="btn-secondary" disabled title="Undo last (Z)">↩ Undo</button>
    </div>
    <div class="swipe-stage" id="swipeStage">
      <div class="swipe-card" id="swipeCard" hidden>
        <div class="card-text" id="swipeText"></div>
        <textarea class="card-edit" id="swipeEdit" hidden></textarea>
        <div class="edit-bar" id="swipeEditBar" hidden>
          <span class="count" id="swipeEditCount">0 / 280</span>
          <span class="spacer"></span>
          <button type="button" id="swipeEditCancel">Cancel</button>
          <button type="button" class="primary" id="swipeEditSave">Save</button>
        </div>
        <div class="card-meta" id="swipeMeta">
          <span class="count" id="swipeCount">0 / 280</span>
          <span class="warn" id="swipeWarn" hidden>Over 280 — edit or reject</span>
        </div>
      </div>
      <div class="swipe-empty" id="swipeEmpty" hidden>
        <h2>Deck clear</h2>
        <p>Nothing left to review. Accepted posts are already in your queue.</p>
        <button class="primary" id="swipeEmptyDone">Back to queue</button>
      </div>
    </div>
    <div class="swipe-actions" id="swipeActions">
      <button class="rej" id="swipeReject" title="Reject (←)">✕</button>
      <button class="acc" id="swipeAccept" title="Accept → queue (→)">✓</button>
    </div>
    <p class="swipe-hint" id="swipeHint">← reject · → accept</p>
  </div>

    <div class="tabs">
      <button class="tab active" id="tabQueue">Queue</button>
      <button class="tab" id="tabHistory">History</button>
      <button class="btn-secondary" id="shuffleQueue" title="Randomise queue" hidden>🔀<span class="lbl"> Randomise</span></button>
    </div>
    <div class="tab-summary" id="tabSummary"></div>
    <div class="list" id="queue"></div>
    <div class="list" id="history" hidden></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modal" hidden>
    <div class="modal-box">
      <p class="modal-title" id="modalTitle"></p>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel">Cancel</button>
        <button class="primary" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const INTERVALS = [1, 3, 6, 9, 12, 24, 0]; // 0 (∞) = paused: nothing auto-posts
    let secret = localStorage.getItem("xqueue_secret") || "";
    let state = null;
    let editingId = null; // id of the queued post currently being edited, or null
    let expandedId = null; // id of the queued post whose actions are revealed (mobile)
    let queueVisible = 50; // how many queued posts to render ("Load more" raises this)
    let historyExtra = []; // older history rows loaded past the first page (Load more)
    let activeTab = "queue"; // which list tab is showing: "queue" | "history"
    let reviewEditingId = null; // deck-list row being edited
    let reviewExpandedId = null; // deck-list row with actions revealed (mobile)
    let swipeMode = false; // full-screen card review open
    let swipeEditing = false; // editing the front card
    let swipeBusy = false; // block double-tap during animation/request
    let swipeSession = { accepted: 0, rejected: 0 }; // client-side counters for this open
    let swipeEnterBelow = false; // next card should animate in from below
    // On touch devices there's no Shift key and Return should insert a newline,
    // so we don't hijack Enter to submit — the Queue/Save buttons do that instead.
    const isTouch = window.matchMedia("(pointer: coarse)").matches;
    const MAX_LEN = 280;

    function showLogin(error) {
      const el = document.getElementById("login");
      el.hidden = false;
      const errEl = document.getElementById("loginError");
      errEl.textContent = error || "";
      errEl.hidden = !error;
      const input = document.getElementById("loginInput");
      input.value = "";
      input.focus();
    }

    function hideLogin() {
      document.getElementById("login").hidden = true;
    }

    // Validate a passphrase by hitting /api/state. On success, unlock + store.
    async function tryUnlock(pass) {
      secret = pass;
      try {
        const res = await fetch("/api/state", {
          headers: { "content-type": "application/json", "x-app-secret": secret },
        });
        if (res.ok) {
          localStorage.setItem("xqueue_secret", secret);
          state = await res.json();
          hideLogin();
          render();
          return true;
        }
        const data = await res.json().catch(() => ({}));
        secret = "";
        localStorage.removeItem("xqueue_secret");
        showLogin(data.error || "Incorrect passphrase.");
        return false;
      } catch (e) {
        secret = "";
        showLogin("Connection error — try again.");
        return false;
      }
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: { "content-type": "application/json", "x-app-secret": secret, ...(opts.headers || {}) },
      });
      if (res.status === 401 || res.status === 429) {
        const data = await res.json().catch(() => ({}));
        localStorage.removeItem("xqueue_secret");
        secret = "";
        showLogin(data.error || "Session ended — sign in again.");
        throw new Error("unauthorized");
      }
      return res.json();
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    // Custom confirm modal (replaces the native confirm()). Returns a Promise<bool>.
    // Confirm resolves true; Cancel / backdrop click / Escape resolve false.
    function confirmDialog(opts = {}) {
      return new Promise((resolve) => {
        const overlay = document.getElementById("modal");
        const confirmBtn = document.getElementById("modalConfirm");
        const cancelBtn = document.getElementById("modalCancel");
        document.getElementById("modalTitle").textContent = opts.title || "Are you sure?";
        const bodyEl = document.getElementById("modalBody");
        bodyEl.textContent = opts.body || "";
        bodyEl.className = "modal-body" + (opts.quote ? " quote" : "");
        confirmBtn.textContent = opts.confirmLabel || "Confirm";
        confirmBtn.className = opts.danger ? "danger" : "primary";
        cancelBtn.textContent = opts.cancelLabel || "Cancel";

        function onKey(e) {
          if (e.key === "Escape") close(false);
          if (e.key === "Enter") close(true);
        }
        function close(result) {
          overlay.hidden = true;
          confirmBtn.onclick = cancelBtn.onclick = overlay.onclick = null;
          document.removeEventListener("keydown", onKey);
          resolve(result);
        }
        confirmBtn.onclick = () => close(true);
        cancelBtn.onclick = () => close(false);
        overlay.onclick = (e) => { if (e.target === overlay) close(false); };
        document.addEventListener("keydown", onKey);

        overlay.hidden = false;
        confirmBtn.focus();
      });
    }

    function fmtWhen(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    function fmtCountdown(ms) {
      const diff = ms - Date.now();
      if (diff <= 0) return "now";
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      return h > 0 ? `in ${h}h ${m}m` : `in ${m}m`;
    }

    // Grow a textarea to fit its content so all text is visible without scrolling.
    function autoGrow(ta) {
      ta.style.height = "auto";
      ta.style.height = ta.scrollHeight + "px";
    }

    function fmtRunway(days) {
      if (!isFinite(days) || days <= 0) return "0 day";
      if (days < 1) return Math.max(1, Math.round(days * 24)) + "h";
      const val = days < 10
        ? (Math.round(days * 10) / 10).toString().replace(/\.0$/, "")
        : String(Math.round(days));
      return val + " day"; // attributive ("14 day runway"), always singular
    }

    // Cost helpers (X prices in USD; we display AUD via the cron-cached rate).
    function fxRate() { return state && state.fx_usd_aud ? state.fx_usd_aud : 1.44; }
    function aud(usd, dp = 2) { return "A$" + (Number(usd || 0) * fxRate()).toFixed(dp); }
    function textHasLink(t) {
      return /(https?:\/\/|www\.)\S+/i.test(t) ||
        /\b[a-z0-9-]+\.(com|net|org|io|co|ai|app|dev|xyz|me|gg|so|to|tv|info|link|page|site|news|blog|store|shop)\b/i.test(t);
    }

    function reviewItems() {
      return (state && state.review && state.review.items) || [];
    }

    function render() {
      if (!state) return;
      const scrollY = window.scrollY; // preserve position across the list rebuild

      // Interval selector — purely the queue's drain cadence (global).
      const box = document.getElementById("intervals");
      box.innerHTML = "";
      INTERVALS.forEach((h) => {
        const b = document.createElement("button");
        b.textContent = h === 0 ? "∞" : h + "h";
        b.title = h === 0
          ? "Pause the queue — nothing auto-posts until you pick an interval"
          : "Queue drains every " + h + " hour" + (h > 1 ? "s" : "");
        if (h === state.interval_hours) b.classList.add("active");
        b.onclick = async () => {
          state = await api("/api/interval", { method: "POST", body: JSON.stringify({ hours: h }) });
          render();
        };
        box.appendChild(b);
      });

      updateReviewChrome();

      // Usage + next line
      const paused = state.interval_hours === 0;
      document.getElementById("usage").textContent = `${state.count24h}/${state.daily_cap} posted (24h)`;
      const nextEl = document.getElementById("next");
      if (paused) {
        nextEl.innerHTML = state.queued.length
          ? `Queue <b>paused</b> &middot; nothing auto-posts &middot; ${state.queued.length} waiting`
          : `Queue is empty &middot; <b>paused</b>`;
      } else if (state.queued.length) {
        const capped = state.count24h >= state.daily_cap;
        nextEl.innerHTML = capped
          ? `Daily cap reached — next post <b>after older posts age out</b>. Interval: every ${state.interval_hours}h.`
          : `Next post <b>${fmtCountdown(state.next_eligible_at)}</b> &middot; every ${state.interval_hours}h`;
      } else {
        nextEl.innerHTML = `Queue is empty &middot; every ${state.interval_hours}h`;
      }

      // Queue (oldest first = next to post at top)
      const q = document.getElementById("queue");
      q.innerHTML = "";
      if (!state.queued.length) {
        q.innerHTML = '<div class="empty">Nothing queued. Type above and hit Enter.</div>';
      }
      state.queued.slice(0, queueVisible).forEach((item, i) => {
        const el = document.createElement("div");
        el.className = "item queued" + (i === 0 ? " next" : "") + (item.id === expandedId ? " expanded" : "");

        if (item.id === editingId) {
          // Inline edit form. Auto-refresh is paused while editing (see refresh()).
          const ta = document.createElement("textarea");
          ta.className = "edit-area";
          ta.value = item.text;
          const bar = document.createElement("div");
          bar.className = "edit-bar";
          const cnt = document.createElement("span");
          cnt.className = "count";
          const save = document.createElement("button");
          save.className = "primary";
          save.textContent = "Save";
          const cancel = document.createElement("button");
          cancel.textContent = "Cancel";
          const setCnt = () => {
            const n = ta.value.length;
            cnt.textContent = `${n} / ${MAX_LEN}`;
            cnt.classList.toggle("over", n > MAX_LEN);
            save.disabled = n === 0 || n > MAX_LEN;
          };
          ta.addEventListener("input", () => { setCnt(); autoGrow(ta); });
          ta.addEventListener("keydown", (e) => {
            if (!isTouch && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); save.click(); }
            if (e.key === "Escape") { e.preventDefault(); cancel.click(); }
          });
          save.onclick = () => saveEdit(item.id, ta.value.trim());
          cancel.onclick = () => { editingId = null; render(); };
          bar.append(cnt, document.createElement("span")); // spacer
          bar.lastChild.className = "spacer";
          bar.append(cancel, save);
          const body = document.createElement("div");
          body.className = "body";
          body.append(ta, bar);
          el.appendChild(body);
          q.appendChild(el);
          setCnt();
          autoGrow(ta); // size to fit the full text — no inner scrolling
          ta.focus();
          // Pull the edit box up so the on-screen keyboard doesn't cover it.
          // Deferred so it runs after render()'s scroll-restore and the keyboard opens.
          setTimeout(() => ta.scrollIntoView({ block: "center", behavior: "smooth" }), 120);
          return;
        }

        el.innerHTML = `
          <div class="body">
            <div class="txt"></div>
            <div class="meta">
              ${i === 0 ? '<span class="badge next">next</span>' : `<span>#${i + 1} in line</span>`}
              <span>added ${fmtWhen(item.created_at)}</span>
              <span>· ${aud(item.cost_usd)}${textHasLink(item.text) ? " (link)" : ""}</span>
            </div>
          </div>`;
        el.querySelector(".txt").textContent = item.text;
        // Mobile: tap the post body to reveal/hide its action bar.
        if (isTouch) {
          el.querySelector(".body").addEventListener("click", (e) => {
            if (e.target.closest("button") || e.target.closest("a")) return;
            expandedId = expandedId === item.id ? null : item.id;
            render();
          });
        }
        const controls = document.createElement("div");
        controls.className = "item-actions";

        const up = document.createElement("button");
        up.className = "iconbtn";
        up.textContent = "▲";
        up.title = "Move up";
        up.disabled = i === 0;
        up.onclick = () => moveItem(item.id, "up");

        const down = document.createElement("button");
        down.className = "iconbtn";
        down.textContent = "▼";
        down.title = "Move down";
        down.disabled = i === state.queued.length - 1;
        down.onclick = () => moveItem(item.id, "down");

        const send = document.createElement("button");
        send.className = "iconbtn send";
        send.textContent = "➤";
        send.title = "Post this now";
        send.onclick = () => postQueuedNow(item.id, item.text);

        const edit = document.createElement("button");
        edit.className = "iconbtn";
        edit.textContent = "✎";
        edit.title = "Edit";
        edit.onclick = () => { editingId = item.id; render(); };

        const del = document.createElement("button");
        del.className = "iconbtn del";
        del.textContent = "×";
        del.title = "Delete";
        del.onclick = async () => {
          const ok = await confirmDialog({
            title: "Delete this post?",
            body: item.text,
            quote: true,
            confirmLabel: "Delete",
            danger: true,
          });
          if (!ok) return;
          try {
            expandedId = null;
            state = await api("/api/queue/" + item.id, { method: "DELETE" });
            render();
            toast("Deleted");
          } catch (e) { /* handled in api() */ }
        };
        controls.append(up, down, send, edit, del);
        el.appendChild(controls); // sibling of body: right side on desktop, row below on mobile
        q.appendChild(el);
      });

      // "Load more" tile — reveals the next chunk of queued posts (client-side;
      // the whole queue is already loaded, this just caps how many we render).
      if (state.queued.length > queueVisible) {
        const more = document.createElement("div");
        more.className = "load-more";
        more.textContent = "Load more…";
        more.onclick = () => { queueVisible += 50; render(); };
        q.appendChild(more);
      }

      // History (most recent first)
      const h = document.getElementById("history");
      h.innerHTML = "";
      // Merge the first page (from /api/state) with any older pages pulled in via
      // "Load more", de-duping by id (a fresh post can shift the page boundary).
      const histSeen = new Set();
      const histList = [];
      for (const row of state.history.concat(historyExtra)) {
        if (histSeen.has(row.id)) continue;
        histSeen.add(row.id);
        histList.push(row);
      }
      if (!histList.length) {
        h.innerHTML = '<div class="empty">No posts yet.</div>';
      }
      histList.forEach((item) => {
        const el = document.createElement("div");
        el.className = "item";
        const badge = item.status === "posted"
          ? '<span class="badge posted">posted</span>'
          : '<span class="badge failed">failed</span>';
        const link = item.tweet_id ? ` &middot; <a href="https://x.com/i/web/status/${item.tweet_id}" target="_blank" rel="noopener">view</a>` : "";
        const err = item.error ? ` &middot; ${escapeHtml(item.error).slice(0, 120)}` : "";
        el.innerHTML = `
          <div class="body">
            <div class="txt"></div>
            <div class="meta">${badge}<span>${fmtWhen(item.posted_at || item.created_at)}${item.status === "posted" ? " · " + aud(item.cost_usd) : ""}${link}${err}</span></div>
          </div>`;
        el.querySelector(".txt").textContent = item.text;
        h.appendChild(el);
      });

      // "Load more" tile for history — cursor-paginates the next older page.
      if (histList.length < (state.historyTotal || 0)) {
        const oldest = histList[histList.length - 1];
        const before = oldest ? (oldest.posted_at || oldest.created_at) : Date.now();
        const more = document.createElement("div");
        more.className = "load-more";
        more.textContent = "Load more…";
        more.onclick = () => loadMoreHistory(before);
        h.appendChild(more);
      }

      applyTab(); // update tab labels/counts and which list is visible
      window.scrollTo(0, scrollY); // restore scroll so actions don't jump the page
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function refresh() {
      if (!secret) return; // locked — login page is showing
      if (editingId !== null) return; // don't clobber an in-progress edit
      if (swipeMode || reviewEditingId !== null) return; // don't fight the review UI
      try {
        state = await api("/api/state");
        render();
      } catch (e) { /* handled in api() */ }
    }

    let loadingHistory = false;
    async function loadMoreHistory(before) {
      if (loadingHistory) return;
      loadingHistory = true;
      try {
        const res = await api("/api/history?before=" + before);
        if (res && res.ok && Array.isArray(res.history)) {
          historyExtra = historyExtra.concat(res.history);
          render();
        }
      } catch (e) { /* handled in api() */ } finally {
        loadingHistory = false;
      }
    }

    async function postQueuedNow(id, text) {
      const ok = await confirmDialog({
        title: "Post to X now?",
        body: text,
        quote: true,
        confirmLabel: "Post now",
      });
      if (!ok) return;
      try {
        const res = await api("/api/queue/" + id + "/post-now", { method: "POST" });
        if (res.ok) {
          expandedId = null;
          state = res;
          render();
          toast("Posted ✅");
        } else {
          toast(res.error || "Post failed");
        }
      } catch (e) { /* handled in api() */ }
    }

    let moving = false; // serialize reorder requests so they can't race in D1
    async function moveItem(id, dir) {
      if (moving) return;
      moving = true;
      try {
        state = await api("/api/queue/" + id + "/move", { method: "POST", body: JSON.stringify({ dir }) });
        render();
      } catch (e) { /* handled in api() */ } finally {
        moving = false;
      }
    }

    // Shuffle the entire queue into a random order. Confirmed via the same modal
    // the delete action uses (confirmDialog), not a native prompt.
    async function randomiseQueue() {
      if (!state || state.queued.length < 2) return;
      const ok = await confirmDialog({
        title: "Randomise the queue?",
        body: "This shuffles all " + state.queued.length + " queued posts into a new random order. Nothing is deleted, and your interval and history are untouched.",
        confirmLabel: "Randomise",
      });
      if (!ok) return;
      try {
        const res = await api("/api/queue/shuffle", { method: "POST" });
        if (res.ok) {
          expandedId = null;
          state = res;
          render();
          toast("Queue randomised");
        } else {
          toast(res.error || "Couldn't randomise");
        }
      } catch (e) { /* handled in api() */ }
    }

    function applyTab() {
      document.getElementById("queue").hidden = activeTab !== "queue";
      document.getElementById("history").hidden = activeTab !== "history";
      document.getElementById("tabQueue").classList.toggle("active", activeTab === "queue");
      document.getElementById("tabHistory").classList.toggle("active", activeTab === "history");
      if (state) {
        document.getElementById("tabQueue").textContent = `Queue (${state.queued.length})`;
        const ht = state.historyTotal != null ? state.historyTotal : state.history.length;
        document.getElementById("tabHistory").textContent = `History (${ht})`;
        document.getElementById("shuffleQueue").hidden = !(activeTab === "queue" && state.queued.length >= 2);

        const summary = document.getElementById("tabSummary");
        if (activeTab === "queue") {
          if (state.queued.length && state.interval_hours) {
            const perDay = Math.min(24 / state.interval_hours, state.daily_cap);
            const runwayDays = state.queued.length / perDay;
            const empties = new Date(Date.now() + runwayDays * 86400000)
              .toLocaleDateString(undefined, { month: "short", day: "numeric" });
            summary.textContent =
              `~${fmtRunway(runwayDays)} runway (empties ${empties}) · ≈ ${aud(state.queue_estimate_usd)} to send`;
          } else if (state.queued.length) {
            // Paused: no drain cadence, so no runway — just the cost to send.
            summary.textContent = `Paused · ≈ ${aud(state.queue_estimate_usd)} to send`;
          } else {
            summary.textContent = "";
          }
        } else {
          summary.textContent = `${aud(state.total_spent_usd)} spent so far · ${state.spent_posts || 0} posted`;
        }
      }
    }

    async function saveEdit(id, text) {
      if (!text || text.length > MAX_LEN) return;
      try {
        const res = await api("/api/queue/" + id, { method: "PATCH", body: JSON.stringify({ text }) });
        if (res.ok) {
          editingId = null;
          state = res;
          render();
          toast("Updated");
        } else {
          toast(res.error || "Failed to update");
        }
      } catch (e) { /* handled in api() */ }
    }

    async function add(immediate) {
      const ta = document.getElementById("text");
      const text = ta.value.trim();
      // Same gate for Queue and Post now — empty or over-limit never fire.
      if (!text || text.length > MAX_LEN) return;
      if (immediate) {
        const ok = await confirmDialog({
          title: "Post to X now?",
          body: text,
          quote: true,
          confirmLabel: "Post now",
        });
        if (!ok) return;
      }
      const q = document.getElementById("add");
      const p = document.getElementById("postNow");
      q.disabled = true; p.disabled = true;
      try {
        const path = immediate ? "/api/post-text" : "/api/queue";
        const res = await api(path, { method: "POST", body: JSON.stringify({ text }) });
        if (res.ok) {
          state = res;
          ta.value = "";
          render();
          toast(immediate ? "Posted ✅" : "Queued");
        } else {
          toast(res.error || (immediate ? "Post failed" : "Failed to queue"));
        }
      } finally {
        // Re-derive disabled from current text (don't blindly re-enable).
        updateCount();
      }
    }

    function updateCount() {
      const ta = document.getElementById("text");
      const n = ta.value.length;
      const c = document.getElementById("count");
      c.textContent = `${n} / ${MAX_LEN}`;
      c.classList.toggle("over", n > MAX_LEN);
      const disabled = n === 0 || n > MAX_LEN;
      document.getElementById("add").disabled = disabled;
      document.getElementById("postNow").disabled = disabled;

      // Live cost estimate for the current post (flags links — 13x pricier).
      const costEl = document.getElementById("costEst");
      const link = n > 0 && textHasLink(ta.value);
      const usd = link ? 0.2 : 0.015;
      costEl.textContent = n === 0 ? "" : "· " + aud(usd) + (link ? " · link" : "");
      costEl.classList.toggle("link", link);
    }

    document.getElementById("text").addEventListener("input", updateCount);
    document.getElementById("text").addEventListener("keydown", (e) => {
      if (!isTouch && e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const n = document.getElementById("text").value.length;
        const t = document.getElementById("text").value.trim();
        if (t && n <= MAX_LEN) add(false); // Enter queues; Post now is an explicit click
      }
    });
    document.getElementById("add").addEventListener("click", () => add(false));
    document.getElementById("postNow").addEventListener("click", () => add(true));

    // Queue / History tabs
    document.getElementById("tabQueue").addEventListener("click", () => { activeTab = "queue"; applyTab(); });
    document.getElementById("tabHistory").addEventListener("click", () => { activeTab = "history"; applyTab(); });
    document.getElementById("shuffleQueue").addEventListener("click", randomiseQueue);

    // Adapt the hint to the device: mobile has no Shift+Enter, so guide to the button.
    document.getElementById("text").placeholder = isTouch
      ? "What's happening? Return adds a new line — tap Queue to add it."
      : "What's happening? (Enter to queue, Shift+Enter for newline)";

    // ---- Bulk import ----
    function importSplitMode() {
      const el = document.querySelector('input[name="split"]:checked');
      return el ? el.value : "blank";
    }
    function parseImport(text, mode) {
      const parts = mode === "line" ? text.split(/\r?\n/) : text.split(/\r?\n\s*\r?\n/);
      return parts.map((p) => p.trim()).filter((p) => p.length > 0);
    }
    function updateImportCount() {
      const posts = parseImport(document.getElementById("importText").value, importSplitMode());
      const over = posts.filter((p) => p.length > MAX_LEN).length;
      const c = document.getElementById("importCount");
      c.textContent = over
        ? `${posts.length} posts · ${over} over ${MAX_LEN}`
        : `${posts.length} post${posts.length === 1 ? "" : "s"}`;
      c.classList.toggle("over", over > 0);
      document.getElementById("importAdd").disabled = posts.length === 0;
    }
    document.getElementById("importToggle").addEventListener("click", () => {
      document.getElementById("reviewPanel").hidden = true;
      const p = document.getElementById("importPanel");
      p.hidden = !p.hidden;
      // Don't auto-focus the textarea — on mobile that pops the keyboard.
    });
    document.getElementById("importText").addEventListener("input", updateImportCount);
    document.querySelectorAll('input[name="split"]').forEach((r) =>
      r.addEventListener("change", updateImportCount)
    );
    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        document.getElementById("importText").value = String(reader.result || "");
        updateImportCount();
      };
      reader.readAsText(file);
      e.target.value = ""; // allow re-selecting the same file
    });
    document.getElementById("importCancel").addEventListener("click", () => {
      document.getElementById("importText").value = "";
      document.getElementById("importPanel").hidden = true;
      updateImportCount();
    });
    document.getElementById("importAdd").addEventListener("click", async () => {
      const posts = parseImport(document.getElementById("importText").value, importSplitMode());
      if (!posts.length) return;
      const btn = document.getElementById("importAdd");
      btn.disabled = true;
      try {
        const res = await api("/api/queue/bulk", { method: "POST", body: JSON.stringify({ texts: posts }) });
        if (res.ok) {
          state = res;
          let msg = `Added ${res.added}`;
          const skipped = (res.skippedLong || 0) + (res.skippedEmpty || 0);
          if (res.skippedLong) msg += ` · skipped ${res.skippedLong} over ${MAX_LEN}`;
          document.getElementById("importText").value = "";
          document.getElementById("importPanel").hidden = true;
          updateImportCount();
          render();
          toast(msg);
        } else {
          toast(res.error || "Import failed");
        }
      } finally {
        btn.disabled = false;
      }
    });

    // ---- Review (deck + Tinder swipe) ----
    function reviewSplitMode() {
      const el = document.querySelector('input[name="reviewSplit"]:checked');
      return el ? el.value : "blank";
    }
    function updateReviewSeedCount() {
      const posts = parseImport(document.getElementById("reviewText").value, reviewSplitMode());
      const over = posts.filter((p) => p.length > MAX_LEN).length;
      const c = document.getElementById("reviewSeedCount");
      c.textContent = over
        ? `${posts.length} posts · ${over} over ${MAX_LEN}`
        : `${posts.length} post${posts.length === 1 ? "" : "s"}`;
      c.classList.toggle("over", over > 0);
      document.getElementById("reviewSeed").disabled = posts.length === 0;
    }
    function updateReviewChrome() {
      const count = state && state.review ? state.review.count : 0;
      const badge = document.getElementById("reviewBadge");
      if (count > 0) {
        badge.hidden = false;
        badge.textContent = String(count);
      } else {
        badge.hidden = true;
      }
      // Deck list (only when panel is open)
      if (!document.getElementById("reviewPanel").hidden) {
        renderReviewDeckList();
      }
      if (swipeMode) renderSwipeCard();
    }
    function renderReviewDeckList() {
      const items = reviewItems();
      const section = document.getElementById("reviewDeckSection");
      const list = document.getElementById("reviewList");
      if (!items.length) {
        section.hidden = true;
        list.innerHTML = "";
        return;
      }
      section.hidden = false;
      const over = items.filter((it) => (it.text || "").length > MAX_LEN).length;
      document.getElementById("reviewDeckLabel").textContent =
        `Deck · ${items.length} pending` + (over ? ` · ${over} over ${MAX_LEN}` : "");
      list.innerHTML = "";
      items.forEach((item, idx) => {
        const el = document.createElement("div");
        const n = (item.text || "").length;
        const isOver = n > MAX_LEN;
        el.className = "item review-row" + (isOver ? " over" : "") + (item.id === reviewExpandedId ? " expanded" : "");

        if (reviewEditingId === item.id) {
          const ta = document.createElement("textarea");
          ta.className = "edit-area";
          ta.value = item.text;
          const bar = document.createElement("div");
          bar.className = "edit-bar";
          const cnt = document.createElement("span");
          cnt.className = "count";
          const save = document.createElement("button");
          save.className = "primary";
          save.textContent = "Save";
          const cancel = document.createElement("button");
          cancel.textContent = "Cancel";
          // Deck edits may stay over 280 (accept is what enforces the limit).
          const setCnt = () => {
            const len = ta.value.length;
            cnt.textContent = `${len} / ${MAX_LEN}`;
            cnt.classList.toggle("over", len > MAX_LEN);
            save.disabled = ta.value.trim().length === 0;
          };
          ta.addEventListener("input", () => { setCnt(); autoGrow(ta); });
          save.onclick = async () => {
            const text = ta.value.trim();
            if (!text) return;
            try {
              const res = await api("/api/review/" + item.id, {
                method: "PATCH",
                body: JSON.stringify({ text }),
              });
              if (res.ok) {
                reviewEditingId = null;
                reviewExpandedId = null;
                state = res;
                render();
                toast("Updated");
              } else toast(res.error || "Failed to update");
            } catch (e) { /* api() */ }
          };
          cancel.onclick = () => { reviewEditingId = null; renderReviewDeckList(); };
          bar.append(cnt, Object.assign(document.createElement("span"), { className: "spacer" }), cancel, save);
          const body = document.createElement("div");
          body.className = "body";
          body.append(ta, bar);
          el.appendChild(body);
          list.appendChild(el);
          setCnt();
          autoGrow(ta);
          ta.focus();
          return;
        }

        el.innerHTML = `
          <div class="body">
            <div class="txt"></div>
            <div class="meta">
              <span>#${idx + 1}</span>
              <span class="char-meta${isOver ? " over" : ""}">${n} / ${MAX_LEN}</span>
              ${isOver ? '<span class="badge failed">over limit</span>' : ""}
            </div>
          </div>`;
        el.querySelector(".txt").textContent = item.text;
        // Mobile: tap body to reveal/hide edit + delete (same pattern as queue).
        if (isTouch) {
          el.querySelector(".body").addEventListener("click", (e) => {
            if (e.target.closest("button") || e.target.closest("a")) return;
            reviewExpandedId = reviewExpandedId === item.id ? null : item.id;
            renderReviewDeckList();
          });
        }
        const controls = document.createElement("div");
        controls.className = "item-actions";
        const edit = document.createElement("button");
        edit.className = "iconbtn";
        edit.textContent = "✎";
        edit.title = "Edit";
        edit.onclick = () => { reviewEditingId = item.id; reviewExpandedId = null; renderReviewDeckList(); };
        const del = document.createElement("button");
        del.className = "iconbtn del";
        del.textContent = "×";
        del.title = "Remove from deck";
        del.onclick = async () => {
          const ok = await confirmDialog({
            title: "Remove from review deck?",
            body: item.text,
            quote: true,
            confirmLabel: "Remove",
            danger: true,
          });
          if (!ok) return;
          try {
            state = await api("/api/review/" + item.id, { method: "DELETE" });
            reviewExpandedId = null;
            render();
            toast("Removed");
          } catch (e) { /* api() */ }
        };
        controls.append(edit, del);
        el.appendChild(controls);
        list.appendChild(el);
      });
    }

    function openSwipeMode() {
      swipeMode = true;
      swipeEditing = false;
      swipeBusy = false;
      swipeEnterBelow = false;
      swipeSession = { accepted: 0, rejected: 0 };
      document.getElementById("reviewSwipe").hidden = false;
      document.body.style.overflow = "hidden";
      renderSwipeCard();
    }
    function closeSwipeMode() {
      // Hide immediately so Done feels responsive; save any draft in the background.
      let pendingSave = null;
      if (swipeEditing && !swipeBusy) {
        const item = currentSwipeItem();
        const text = document.getElementById("swipeEdit").value.trim();
        if (item && text) {
          pendingSave = { id: item.id, text };
        }
      }
      swipeMode = false;
      swipeEditing = false;
      swipeBusy = false;
      swipeEnterBelow = false;
      document.getElementById("reviewSwipe").hidden = true;
      document.body.style.overflow = "";
      render();
      if (pendingSave) {
        api("/api/review/" + pendingSave.id, {
          method: "PATCH",
          body: JSON.stringify({ text: pendingSave.text }),
        }).then((res) => {
          if (res && res.ok) state = res;
        }).catch(() => {});
      }
    }

    function currentSwipeItem() {
      const items = reviewItems();
      return items.length ? items[0] : null;
    }

    function swipeTextValue() {
      if (swipeEditing) return document.getElementById("swipeEdit").value;
      const item = currentSwipeItem();
      return item ? item.text : "";
    }

    function updateSwipeMeta() {
      const raw = swipeTextValue();
      const n = raw.length;
      const trimmed = raw.trim();
      const overLimit = n > MAX_LEN;
      const empty = trimmed.length === 0;
      const cnt = document.getElementById("swipeCount");
      const editCnt = document.getElementById("swipeEditCount");
      cnt.textContent = `${n} / ${MAX_LEN}`;
      cnt.classList.toggle("over", overLimit);
      editCnt.textContent = `${n} / ${MAX_LEN}`;
      editCnt.classList.toggle("over", overLimit);
      document.getElementById("swipeWarn").hidden = !overLimit || swipeEditing;
      document.getElementById("swipeAccept").disabled = empty || overLimit || swipeBusy || swipeEditing;
      document.getElementById("swipeUndo").disabled = !(state && state.review && state.review.canUndo) || swipeBusy;
      document.getElementById("swipeReject").disabled = swipeBusy || swipeEditing;
      const saveBtn = document.getElementById("swipeEditSave");
      if (saveBtn) saveBtn.disabled = empty;
    }

    function resetSwipeCardInstant() {
      const card = document.getElementById("swipeCard");
      card.style.transition = "none";
      card.classList.remove("out-left", "out-right", "flash-ok", "flash-no", "enter-below", "editing");
      card.style.transform = "";
      card.style.opacity = "";
      void card.offsetWidth; // flush
      card.style.transition = "";
    }

    function renderSwipeCard() {
      if (!swipeMode) return;
      const item = currentSwipeItem();
      const card = document.getElementById("swipeCard");
      const empty = document.getElementById("swipeEmpty");
      const actions = document.getElementById("swipeActions");
      const hint = document.getElementById("swipeHint");
      const left = reviewItems().length;
      const prog = document.getElementById("swipeProgress");
      prog.textContent = left
        ? `${left} left · ✓${swipeSession.accepted} · ✕${swipeSession.rejected}`
        : `Done · ✓${swipeSession.accepted} · ✕${swipeSession.rejected}`;

      if (!item) {
        card.hidden = true;
        empty.hidden = false;
        actions.hidden = true;
        hint.hidden = true;
        document.getElementById("swipeUndo").disabled = !(state && state.review && state.review.canUndo);
        return;
      }
      empty.hidden = true;
      actions.hidden = false;
      hint.hidden = false;
      card.hidden = false;

      // Avoid sliding the next card in from the exit side: hard-reset transforms first.
      const doEnter = swipeEnterBelow;
      swipeEnterBelow = false;
      resetSwipeCardInstant();

      const textEl = document.getElementById("swipeText");
      const editEl = document.getElementById("swipeEdit");
      const editBar = document.getElementById("swipeEditBar");
      const meta = document.getElementById("swipeMeta");
      if (swipeEditing) {
        card.classList.add("editing");
        textEl.hidden = true;
        editEl.hidden = false;
        editBar.hidden = false;
        meta.hidden = true;
        if (document.activeElement !== editEl) {
          editEl.value = item.text;
          autoGrow(editEl);
        }
      } else {
        card.classList.remove("editing");
        textEl.hidden = false;
        editEl.hidden = true;
        editBar.hidden = true;
        meta.hidden = false;
        textEl.textContent = item.text;
      }
      updateSwipeMeta();

      if (doEnter && !swipeEditing) {
        card.classList.add("enter-below");
        const clear = () => card.classList.remove("enter-below");
        card.addEventListener("animationend", clear, { once: true });
        // Fallback if animationend doesn't fire
        setTimeout(clear, 320);
      }
    }

    // Continue the card off-screen from its current drag offset (no snap-to-centre first).
    function finishSwipeOut(dir, fromDx) {
      return new Promise((resolve) => {
        const card = document.getElementById("swipeCard");
        const w = Math.max(window.innerWidth, card.offsetWidth || 320);
        const target = dir === "right" ? w * 1.25 : -w * 1.25;
        const start = typeof fromDx === "number" ? fromDx : 0;
        // Pin starting point without transition, then animate the rest of the way out.
        card.style.transition = "none";
        card.style.transform = `translateX(${start}px) rotate(${start / 40}deg)`;
        card.style.opacity = String(Math.max(0.35, 1 - Math.abs(start) / 420));
        card.classList.add(dir === "right" ? "flash-ok" : "flash-no");
        void card.offsetWidth;
        card.style.transition = "transform .2s ease-out, opacity .2s ease-out";
        card.style.transform = `translateX(${target}px) rotate(${target / 40}deg)`;
        card.style.opacity = "0";
        setTimeout(resolve, 200);
      });
    }

    // Button / keyboard path: fly out from centre.
    function animateCard(dir) {
      return finishSwipeOut(dir, 0);
    }

    async function swipeAccept(opts) {
      opts = opts || {};
      if (swipeBusy || swipeEditing) return;
      const item = currentSwipeItem();
      if (!item) return;
      const text = swipeTextValue().trim();
      if (!text || text.length > MAX_LEN) {
        toast(text.length > MAX_LEN ? `Too long (${text.length}/${MAX_LEN})` : "Empty post");
        // If we were mid-drag, spring back
        if (opts.fromDx != null) springCardBack(opts.fromDx);
        return;
      }
      swipeBusy = true;
      updateSwipeMeta();
      // Animate out immediately from drag position (don't wait on the network).
      const fly = finishSwipeOut("right", opts.fromDx != null ? opts.fromDx : 0);
      try {
        const res = await api("/api/review/" + item.id + "/accept", {
          method: "POST",
          body: JSON.stringify({ text }),
        });
        await fly;
        if (res.ok) {
          swipeEditing = false;
          swipeSession.accepted++;
          state = res;
          swipeEnterBelow = true;
          renderSwipeCard();
          updateReviewChrome();
        } else {
          toast(res.error || "Couldn't queue");
          resetSwipeCardInstant();
          renderSwipeCard();
        }
      } catch (e) { /* api() */ }
      finally {
        swipeBusy = false;
        updateSwipeMeta();
      }
    }

    async function swipeReject(opts) {
      opts = opts || {};
      if (swipeBusy || swipeEditing) return;
      const item = currentSwipeItem();
      if (!item) return;
      swipeBusy = true;
      updateSwipeMeta();
      const fly = finishSwipeOut("left", opts.fromDx != null ? opts.fromDx : 0);
      try {
        const res = await api("/api/review/" + item.id + "/reject", { method: "POST" });
        await fly;
        if (res.ok) {
          swipeEditing = false;
          swipeSession.rejected++;
          state = res;
          swipeEnterBelow = true;
          renderSwipeCard();
          updateReviewChrome();
        } else {
          toast(res.error || "Couldn't reject");
          resetSwipeCardInstant();
          renderSwipeCard();
        }
      } catch (e) { /* api() */ }
      finally {
        swipeBusy = false;
        updateSwipeMeta();
      }
    }

    function springCardBack(fromDx) {
      const card = document.getElementById("swipeCard");
      card.style.transition = "none";
      card.style.transform = `translateX(${fromDx || 0}px) rotate(${(fromDx || 0) / 40}deg)`;
      card.classList.remove("flash-ok", "flash-no");
      void card.offsetWidth;
      card.style.transition = "transform .22s ease, opacity .22s ease";
      card.style.transform = "";
      card.style.opacity = "";
    }

    async function swipeUndo() {
      if (swipeBusy) return;
      if (!(state && state.review && state.review.canUndo)) return;
      // Visual feedback immediately
      const btn = document.getElementById("swipeUndo");
      btn.disabled = true;
      swipeBusy = true;
      try {
        const res = await api("/api/review/undo", { method: "POST" });
        if (res.ok) {
          swipeEditing = false;
          state = res;
          swipeEnterBelow = true;
          renderSwipeCard();
          updateReviewChrome();
          toast("Undone");
        } else {
          toast(res.error || "Can't undo");
          if (state) {
            state = await api("/api/state");
            renderSwipeCard();
          }
        }
      } catch (e) { /* api() */ }
      finally {
        swipeBusy = false;
        updateSwipeMeta();
      }
    }

    function enterSwipeEdit() {
      if (swipeBusy || swipeEditing || !currentSwipeItem()) return;
      swipeEditing = true;
      renderSwipeCard();
      const editEl = document.getElementById("swipeEdit");
      editEl.focus();
      autoGrow(editEl);
    }

    function cancelSwipeEdit() {
      if (!swipeEditing) return;
      swipeEditing = false;
      renderSwipeCard();
    }

    async function saveSwipeEdit() {
      if (!swipeEditing || swipeBusy) return;
      const item = currentSwipeItem();
      if (!item) return;
      const text = document.getElementById("swipeEdit").value.trim();
      if (!text) {
        toast("Empty post");
        return;
      }
      swipeBusy = true;
      updateSwipeMeta();
      try {
        const res = await api("/api/review/" + item.id, {
          method: "PATCH",
          body: JSON.stringify({ text }),
        });
        if (res.ok) {
          swipeEditing = false;
          state = res;
          renderSwipeCard();
          updateReviewChrome();
          toast("Saved");
        } else {
          toast(res.error || "Failed to save");
        }
      } catch (e) { /* api() */ }
      finally {
        swipeBusy = false;
        updateSwipeMeta();
      }
    }

    async function seedReviewDeck() {
      const posts = parseImport(document.getElementById("reviewText").value, reviewSplitMode());
      if (!posts.length) return;
      const existing = reviewItems().length;
      let mode = "replace";
      if (existing > 0) {
        // Append is the safe default; opt into Replace with a second confirm.
        const wantAppend = await confirmDialog({
          title: "Deck already has " + existing + " posts",
          body: "Append these " + posts.length + " posts to the end of the deck?\n\nChoose Cancel if you want to replace the deck instead.",
          confirmLabel: "Append",
          cancelLabel: "Replace…",
        });
        if (wantAppend) {
          mode = "append";
        } else {
          const doReplace = await confirmDialog({
            title: "Replace the deck?",
            body: "This discards all " + existing + " pending review posts and loads the new paste instead.",
            confirmLabel: "Replace",
            danger: true,
          });
          if (!doReplace) return; // cancelled both → abort seed
          mode = "replace";
        }
      }
      const btn = document.getElementById("reviewSeed");
      btn.disabled = true;
      try {
        const res = await api("/api/review", {
          method: "POST",
          body: JSON.stringify({ texts: posts, mode }),
        });
        if (res.ok) {
          state = res;
          document.getElementById("reviewText").value = "";
          updateReviewSeedCount();
          render();
          let msg = `Added ${res.added} to review`;
          if (res.overCount) msg += ` · ${res.overCount} over ${MAX_LEN}`;
          if (res.skippedEmpty) msg += ` · skipped ${res.skippedEmpty} empty`;
          toast(msg);
          if (res.review && res.review.count > 0) openSwipeMode();
        } else {
          toast(res.error || "Failed to seed review");
        }
      } finally {
        updateReviewSeedCount();
      }
    }

    document.getElementById("reviewToggle").addEventListener("click", () => {
      document.getElementById("importPanel").hidden = true;
      const p = document.getElementById("reviewPanel");
      p.hidden = !p.hidden;
      if (!p.hidden) {
        updateReviewSeedCount();
        renderReviewDeckList();
        // Don't auto-focus the textarea — on mobile that pops the keyboard.
      }
    });
    document.getElementById("reviewText").addEventListener("input", updateReviewSeedCount);
    document.querySelectorAll('input[name="reviewSplit"]').forEach((r) =>
      r.addEventListener("change", updateReviewSeedCount)
    );
    document.getElementById("reviewFile").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        document.getElementById("reviewText").value = String(reader.result || "");
        updateReviewSeedCount();
      };
      reader.readAsText(file);
      e.target.value = "";
    });
    document.getElementById("reviewCancel").addEventListener("click", () => {
      document.getElementById("reviewText").value = "";
      document.getElementById("reviewPanel").hidden = true;
      updateReviewSeedCount();
    });
    document.getElementById("reviewSeed").addEventListener("click", () => seedReviewDeck());
    document.getElementById("reviewContinue").addEventListener("click", () => {
      if (!reviewItems().length) {
        toast("Deck is empty — paste posts above");
        return;
      }
      openSwipeMode();
    });
    document.getElementById("reviewEmpty").addEventListener("click", async () => {
      const n = reviewItems().length;
      if (!n) return;
      const ok = await confirmDialog({
        title: "Empty the review deck?",
        body: "This permanently discards all " + n + " pending posts in the deck. Already-queued posts are not affected.",
        confirmLabel: "Empty deck",
        danger: true,
      });
      if (!ok) return;
      try {
        state = await api("/api/review", { method: "DELETE" });
        reviewEditingId = null;
        render();
        toast("Deck emptied");
      } catch (e) { /* api() */ }
    });

    // Fast tap for review chrome (Done / Undo / accept / reject).
    // Uses pointerup + debounce so mobile doesn't wait on the slow click path,
    // and a second event (click after pointerup) can't double-fire.
    function bindTap(el, fn) {
      let last = 0;
      const fire = (e) => {
        const now = Date.now();
        if (now - last < 350) return;
        last = now;
        e.preventDefault();
        e.stopPropagation();
        fn(e);
      };
      el.addEventListener("pointerup", (e) => {
        if (e.button != null && e.button !== 0) return;
        // Ignore if the press didn't start on this control (e.g. swipe release)
        if (e.target !== el && !el.contains(e.target)) return;
        fire(e);
      });
      el.addEventListener("click", (e) => {
        // Safety net when PointerEvent isn't available or was cancelled
        fire(e);
      });
    }
    bindTap(document.getElementById("swipeClose"), () => closeSwipeMode());
    bindTap(document.getElementById("swipeEmptyDone"), () => closeSwipeMode());
    bindTap(document.getElementById("swipeAccept"), () => swipeAccept());
    bindTap(document.getElementById("swipeReject"), () => swipeReject());
    bindTap(document.getElementById("swipeUndo"), () => swipeUndo());
    document.getElementById("swipeEditCancel").addEventListener("click", (e) => {
      e.stopPropagation();
      cancelSwipeEdit();
    });
    document.getElementById("swipeEditSave").addEventListener("click", (e) => {
      e.stopPropagation();
      saveSwipeEdit();
    });
    document.getElementById("swipeEdit").addEventListener("input", () => {
      autoGrow(document.getElementById("swipeEdit"));
      updateSwipeMeta();
    });
    // Tap outside the card (stage / chrome) while editing → save
    document.getElementById("reviewSwipe").addEventListener("click", (e) => {
      if (!swipeMode || !swipeEditing) return;
      const card = document.getElementById("swipeCard");
      if (card.contains(e.target)) return;
      if (e.target.closest("button")) return;
      saveSwipeEdit();
    });

    // Keyboard while swipe mode is open.
    document.addEventListener("keydown", (e) => {
      if (!swipeMode) return;
      const inEdit = document.activeElement === document.getElementById("swipeEdit");
      if (e.key === "Escape") {
        e.preventDefault();
        if (swipeEditing) cancelSwipeEdit();
        else closeSwipeMode();
        return;
      }
      if (swipeEditing) {
        // Enter (no shift) saves on desktop, matching queue edit.
        if (!isTouch && e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          saveSwipeEdit();
        }
        return;
      }
      if (e.key === "ArrowRight" || e.key === "ArrowLeft" || e.key === "z" || e.key === "Z") {
        e.preventDefault();
      }
      if (e.key === "ArrowRight") swipeAccept();
      else if (e.key === "ArrowLeft") swipeReject();
      else if (e.key === "z" || e.key === "Z") swipeUndo();
    });

    // Pointer/touch swipe on the card.
    // - Commit swipe past COMMIT_PX; green/red only past FLASH_PX (later, less sensitive)
    // - Pure short tap (no axis lock, tiny movement) → edit
    // - Drag then release short of commit → spring back, never edit
    const swipePointer = {
      active: false, id: null, startX: 0, startY: 0, lastY: 0, startT: 0,
      dx: 0, dy: 0, maxMove: 0, axis: null, scrollEl: null,
    };
    (function setupCardSwipe() {
