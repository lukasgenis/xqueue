<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>xqueue</title>
  <style>
    :root {
      --bg: #0e1113;
      --panel: #171b1f;
      --panel-2: #1f252a;
      --border: #2a3138;
      --text: #e7edf2;
      --muted: #8a97a3;
      --accent: #1d9bf0;
      --accent-dim: #17517a;
      --danger: #e0555a;
      --ok: #2ecc71;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 18px; }
    header h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
    header .usage { font-size: 12px; color: var(--muted); }

    .composer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      position: sticky; top: 12px; z-index: 5;
    }
    textarea {
      width: 100%; min-height: 84px; resize: vertical;
      background: transparent; border: 0; color: var(--text);
      font: inherit; outline: none;
    }
    .composer-bottom { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .count.over { color: var(--danger); }
    .spacer { flex: 1; }
    button {
      font: inherit; cursor: pointer; border-radius: 999px;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      padding: 6px 14px; transition: background .12s, border-color .12s;
    }
    button:hover { border-color: var(--accent-dim); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.primary:disabled { opacity: .4; cursor: not-allowed; }

    .intervals { display: flex; gap: 4px; }
    .intervals button { padding: 5px 9px; font-size: 13px; min-width: 34px; }
    .intervals button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .next-line { font-size: 12px; color: var(--muted); margin: 14px 2px 8px; }
    .next-line b { color: var(--text); font-weight: 600; }

    .list { display: flex; flex-direction: column; gap: 8px; }
    .item {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
    }
    .item.next { border-color: var(--accent-dim); box-shadow: 0 0 0 1px var(--accent-dim) inset; }
    .item .body { flex: 1; min-width: 0; }
    .item .txt { white-space: pre-wrap; word-wrap: break-word; }
    .item .meta { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); }
    .badge.next { color: var(--accent); border-color: var(--accent-dim); }
    .badge.posted { color: var(--ok); border-color: #1f5c3a; }
    .badge.failed { color: var(--danger); border-color: #5c2a2c; }
    .controls { display: flex; gap: 2px; align-items: flex-start; }
    .iconbtn { color: var(--muted); border: 0; background: transparent; padding: 2px 6px; font-size: 15px; line-height: 1; }
    .iconbtn:hover { color: var(--text); }
    .del:hover { color: var(--danger); }
    .edit-area {
      width: 100%; min-height: 60px; resize: vertical;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font: inherit; padding: 8px; outline: none;
    }
    .edit-area:focus { border-color: var(--accent-dim); }
    .edit-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .edit-bar .spacer { flex: 1; }
    .edit-bar button { padding: 4px 12px; font-size: 13px; }

    .section-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 26px 2px 10px; }
    .empty { color: var(--muted); font-size: 14px; padding: 24px 4px; text-align: center; }
    a { color: var(--accent); }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>xqueue</h1>
      <span class="usage" id="usage"></span>
    </header>

    <div class="composer">
      <textarea id="text" placeholder="What's happening? (Enter to queue, Shift+Enter for newline)"></textarea>
      <div class="composer-bottom">
        <span class="count" id="count">0 / 280</span>
        <div class="intervals" id="intervals"></div>
        <span class="spacer"></span>
        <button class="primary" id="add">Queue</button>
      </div>
    </div>

    <div class="next-line" id="next"></div>

    <div class="section-label">Queue &middot; next post first</div>
    <div class="list" id="queue"></div>

    <div class="section-label">History</div>
    <div class="list" id="history"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const INTERVALS = [1, 3, 6, 9, 12, 24];
    let secret = localStorage.getItem("xqueue_secret") || "";
    let state = null;
    let editingId = null; // id of the queued post currently being edited, or null
    // On touch devices there's no Shift key and Return should insert a newline,
    // so we don't hijack Enter to submit — the Queue/Save buttons do that instead.
    const isTouch = window.matchMedia("(pointer: coarse)").matches;

    function ensureSecret() {
      if (!secret) {
        secret = prompt("Enter the xqueue passphrase:") || "";
        localStorage.setItem("xqueue_secret", secret);
      }
    }

    async function api(path, opts = {}) {
      ensureSecret();
      const res = await fetch(path, {
        ...opts,
        headers: { "content-type": "application/json", "x-app-secret": secret, ...(opts.headers || {}) },
      });
      if (res.status === 401) {
        localStorage.removeItem("xqueue_secret");
        secret = "";
        toast("Wrong passphrase — reload to retry");
        throw new Error("unauthorized");
      }
      return res.json();
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function fmtWhen(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    function fmtCountdown(ms) {
      const diff = ms - Date.now();
      if (diff <= 0) return "now";
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      return h > 0 ? `in ${h}h ${m}m` : `in ${m}m`;
    }

    function render() {
      if (!state) return;

      // Interval toggle
      const box = document.getElementById("intervals");
      box.innerHTML = "";
      INTERVALS.forEach((h) => {
        const b = document.createElement("button");
        b.textContent = h;
        b.title = h + " hour" + (h > 1 ? "s" : "");
        if (h === state.interval_hours) b.classList.add("active");
        b.onclick = async () => {
          state = await api("/api/interval", { method: "POST", body: JSON.stringify({ hours: h }) });
          render();
        };
        box.appendChild(b);
      });

      // Usage + next line
      document.getElementById("usage").textContent = `${state.count24h}/${state.daily_cap} posted (24h)`;
      const nextEl = document.getElementById("next");
      if (state.queued.length) {
        const capped = state.count24h >= state.daily_cap;
        nextEl.innerHTML = capped
          ? `Daily cap reached — next post <b>after older posts age out</b>. Interval: every ${state.interval_hours}h.`
          : `Next post <b>${fmtCountdown(state.next_eligible_at)}</b> &middot; every ${state.interval_hours}h`;
      } else {
        nextEl.innerHTML = `Queue is empty &middot; every ${state.interval_hours}h`;
      }

      // Queue (oldest first = next to post at top)
      const q = document.getElementById("queue");
      q.innerHTML = "";
      if (!state.queued.length) {
        q.innerHTML = '<div class="empty">Nothing queued. Type above and hit Enter.</div>';
      }
      state.queued.forEach((item, i) => {
        const el = document.createElement("div");
        el.className = "item" + (i === 0 ? " next" : "");

        if (item.id === editingId) {
          // Inline edit form. Auto-refresh is paused while editing (see refresh()).
          const ta = document.createElement("textarea");
          ta.className = "edit-area";
          ta.value = item.text;
          const bar = document.createElement("div");
          bar.className = "edit-bar";
          const cnt = document.createElement("span");
          cnt.className = "count";
          const save = document.createElement("button");
          save.className = "primary";
          save.textContent = "Save";
          const cancel = document.createElement("button");
          cancel.textContent = "Cancel";
          const setCnt = () => {
            const n = ta.value.length;
            cnt.textContent = `${n} / 280`;
            cnt.classList.toggle("over", n > 280);
            save.disabled = n === 0 || n > 280;
          };
          ta.addEventListener("input", setCnt);
          ta.addEventListener("keydown", (e) => {
            if (!isTouch && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); save.click(); }
            if (e.key === "Escape") { e.preventDefault(); cancel.click(); }
          });
          save.onclick = () => saveEdit(item.id, ta.value.trim());
          cancel.onclick = () => { editingId = null; render(); };
          bar.append(cnt, document.createElement("span")); // spacer
          bar.lastChild.className = "spacer";
          bar.append(cancel, save);
          const body = document.createElement("div");
          body.className = "body";
          body.append(ta, bar);
          el.appendChild(body);
          q.appendChild(el);
          setCnt();
          ta.focus();
          return;
        }

        el.innerHTML = `
          <div class="body">
            <div class="txt"></div>
            <div class="meta">
              ${i === 0 ? '<span class="badge next">next</span>' : `<span>#${i + 1} in line</span>`}
              <span>added ${fmtWhen(item.created_at)}</span>
            </div>
          </div>`;
        el.querySelector(".txt").textContent = item.text;
        const controls = document.createElement("div");
        controls.className = "controls";
        const edit = document.createElement("button");
        edit.className = "iconbtn";
        edit.textContent = "✎";
        edit.title = "Edit";
        edit.onclick = () => { editingId = item.id; render(); };
        const del = document.createElement("button");
        del.className = "iconbtn del";
        del.textContent = "×";
        del.title = "Remove";
        del.onclick = async () => {
          state = await api("/api/queue/" + item.id, { method: "DELETE" });
          render();
        };
        controls.append(edit, del);
        el.appendChild(controls);
        q.appendChild(el);
      });

      // History (most recent first)
      const h = document.getElementById("history");
      h.innerHTML = "";
      if (!state.history.length) {
        h.innerHTML = '<div class="empty">No posts yet.</div>';
      }
      state.history.forEach((item) => {
        const el = document.createElement("div");
        el.className = "item";
        const badge = item.status === "posted"
          ? '<span class="badge posted">posted</span>'
          : '<span class="badge failed">failed</span>';
        const link = item.tweet_id ? ` &middot; <a href="https://x.com/i/web/status/${item.tweet_id}" target="_blank" rel="noopener">view</a>` : "";
        const err = item.error ? ` &middot; ${escapeHtml(item.error).slice(0, 120)}` : "";
        el.innerHTML = `
          <div class="body">
            <div class="txt"></div>
            <div class="meta">${badge}<span>${fmtWhen(item.posted_at || item.created_at)}${link}${err}</span></div>
          </div>`;
        el.querySelector(".txt").textContent = item.text;
        h.appendChild(el);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function refresh() {
      if (editingId !== null) return; // don't clobber an in-progress edit
      try {
        state = await api("/api/state");
        render();
      } catch (e) { /* handled in api() */ }
    }

    async function saveEdit(id, text) {
      if (!text || text.length > 280) return;
      try {
        const res = await api("/api/queue/" + id, { method: "PATCH", body: JSON.stringify({ text }) });
        if (res.ok) {
          editingId = null;
          state = res;
          render();
          toast("Updated");
        } else {
          toast(res.error || "Failed to update");
        }
      } catch (e) { /* handled in api() */ }
    }

    async function add() {
      const ta = document.getElementById("text");
      const text = ta.value.trim();
      if (!text) return;
      const btn = document.getElementById("add");
      btn.disabled = true;
      try {
        const res = await api("/api/queue", { method: "POST", body: JSON.stringify({ text }) });
        if (res.ok) {
          state = res;
          ta.value = "";
          updateCount();
          render();
          toast("Queued");
        } else {
          toast(res.error || "Failed to queue");
        }
      } finally {
        btn.disabled = false;
      }
    }

    function updateCount() {
      const ta = document.getElementById("text");
      const n = ta.value.length;
      const c = document.getElementById("count");
      c.textContent = `${n} / 280`;
      c.classList.toggle("over", n > 280);
      document.getElementById("add").disabled = n === 0 || n > 280;
    }

    document.getElementById("text").addEventListener("input", updateCount);
    document.getElementById("text").addEventListener("keydown", (e) => {
      if (!isTouch && e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        add();
      }
    });
    document.getElementById("add").addEventListener("click", add);

    // Adapt the hint to the device: mobile has no Shift+Enter, so guide to the button.
    document.getElementById("text").placeholder = isTouch
      ? "What's happening? Return adds a new line — tap Queue to add it."
      : "What's happening? (Enter to queue, Shift+Enter for newline)";

    updateCount();
    refresh();
    setInterval(refresh, 30000); // keep countdown / usage fresh
  </script>
</body>
</html>
