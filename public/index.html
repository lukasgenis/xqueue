<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- Reinforce that this is English so Chrome's content detector doesn't
       misfire (it guesses French on this label-heavy, low-prose UI) and stop
       it offering to translate. -->
  <meta http-equiv="Content-Language" content="en" />
  <meta name="google" content="notranslate" />
  <title>xqueue</title>
  <!-- Icons + PWA. "xq" set in Space Grotesk Bold (glyph outlines baked into the
       SVG/PNGs, so they render without a web font). -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0e1113" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="xqueue" />
  <style>
    /* Space Grotesk Bold, subset to just the logo letters (x,q,u,e) and inlined
       as woff2 so the "xqueue" wordmark renders offline with no external request. */
    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url(data:font/woff2;base64,AAEAAAAQAQAABAAAR0RFRgARAAMAAAQgAAAAGEdQT1NEdkx1AAAEOAAAACBHU1VCuPq49AAABFgAAAAqT1MvMhJ8VE4AAAGIAAAAYFNUQVR5k2tJAAAEhAAAACpjbWFwARIBQQAAAfwAAABMZ2FzcAAAABAAAAQYAAAACGdseWaJMhvhAAACXAAAAU5oZWFkI4C//AAAAQwAAAA2aGhlYQYsAooAAAFEAAAAJGhtdHgNBQEXAAAB6AAAABRsb2NhAMIBEgAAAlAAAAAMbWF4cAAIACYAAAFoAAAAIG5hbWUFbA/zAAADrAAAAExwb3N0/58AMgAAA/gAAAAgcHJlcGgGjIUAAAJIAAAABwABAAAAAgAAM7rwsV8PPPUAAwPoAAAAANucIpkAAAAA5npbSgAa/zgCOAH+AAAABgACAAAAAAAAAAEAAAPY/twAAAOOABoAGgI4AAEAAAAAAAAAAAAAAAAAAAAFAAEAAAAFACUAAgAAAAAAAQAAAAAAAAAAAAAAAAAAAAAABAI9ArwABQAAAooCWAAAAEsCigJYAAABXgAyASMAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAARksAAADAAGUAeAPY/twAAAR+ASQAAAABAAAAAAHmArwAAAAgAAMDjgBfAkEALgJ+AC4CaABCAlAAGgAAAAIAAAADAAAAFAADAAEAAAAUAAQAOAAAAAoACAACAAIAZQBxAHUAeP//AAAAZQBxAHUAeP///5z/kf+O/4wAAQAAAAAAAAAAAAC4Af+FsASNAAAAAAAANABrAI4ApwACAC7/8gIXAf4AGQAgAABFIiYmNTU0NjYzMhYWFRUhFhYzMjY3Fw4CAzMmJiMiBgEoSnE/PnBKSWw8/pcCSDQ1Mg1nDjVYvegEPTEzPA4/c04MTnM/QXNMKzNALhw2Gj0rAT8rNDQAAAIALv84AjgB/gAWACQAAEURIw4CIyImJjU1NDY2MzIWFzM1MxEBMjY1NTQmIyIGFRUUFgG6EgomPS08Zj4+ZztERxESfP78O01OOjpOTsgBAREhFTtyURBRcjstHTz9SAEoS0gKSEtLSApISwAAAQBC//gCIgHwABUAAEUiJiY1ETMRFBYzMjY1NTMRIzUjBgYBAzpXMH43MzpAfnwSDEIINV49ASj+4jg4TUX8/hBBGTAAAAEAGgAAAjYB8AANAABzNyczFzM3MwcXIycjBxq0spJxEnGSsrSUcRJx+valpfb6p6cAAAAAAAMAKgADAAEECQACAA4AAAADAAEECQEAAAwADgADAAEECQEEAAgAGgBSAGUAZwB1AGwAYQByAFcAZQBpAGcAaAB0AEIAbwBsAGQAAwAAAAAAAP+cADIAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAH//wAPAAEAAAAMAAAAAAAAAAEAAQADAAEAAAABAAEAAAAKABwAHgABREZMVAAIAAQAAAAA//8AAAAAAAAAAQAAAAoAJgAoAAJERkxUAA5sYXRuABgABAAAAAD//wAAAAAAAAAAAAAAAAABAAEACAABAAAAFAABAAAAHAACd2dodAEAAAAAAgABAAAAAAEEArwAAAAA) format("woff2");
    }
    :root {
      --bg: #0e1113;
      --panel: #171b1f;
      --panel-2: #1f252a;
      --border: #2a3138;
      --text: #e7edf2;
      --muted: #8a97a3;
      --accent: #1d9bf0;
      --accent-dim: #17517a;
      --danger: #e0555a;
      --ok: #2ecc71;
    }
    * { box-sizing: border-box; }
    /* The [hidden] attribute must always win — author display rules (flex/grid)
       would otherwise override the UA [hidden]{display:none} and leave elements
       stuck visible. This guards every hideable element (login, modal, lists). */
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      /* 16px base so text inputs never trigger iOS focus-zoom (they use font:inherit). */
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    /* Belt-and-suspenders: any focusable text field stays >=16px on iOS. */
    textarea, input, select { font-size: 16px; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }

    .login-overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); padding: 24px;
    }
    /* The display:flex above would otherwise override the [hidden] attribute,
       leaving the overlay stuck on screen after a successful unlock. */
    .login-overlay[hidden] { display: none; }
    .login-box {
      width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px;
    }
    .login-box h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
    .login-sub { margin: 0; color: var(--muted); font-size: 13px; }
    .login-box input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      background: var(--panel-2); border: 1px solid var(--border); color: var(--text); outline: none;
    }
    .login-box input:focus { border-color: var(--accent-dim); }
    .login-box button { width: 100%; padding: 12px; }
    .login-error { margin: 0; color: var(--danger); font-size: 13px; min-height: 1em; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    header h1 { font-size: 20px; margin: 0; letter-spacing: -0.02em; }
    /* Wordmark: Space Grotesk Bold, white. */
    .logo { font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    header .usage { font-size: 12px; color: var(--muted); text-align: right; }
    .lockbtn { background: transparent; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); padding: 5px 11px; font-size: 12px; line-height: 1; white-space: nowrap; }
    .lockbtn:hover { color: var(--text); border-color: var(--accent-dim); }

    .composer {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    textarea {
      width: 100%; min-height: 84px; resize: vertical;
      background: transparent; border: 0; color: var(--text);
      font: inherit; outline: none;
    }
    .composer-bottom { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
    .count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .count.over { color: var(--danger); }
    .cost { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .cost.link { color: var(--danger); }
    .tab-summary { font-size: 12px; color: var(--muted); margin: -4px 2px 12px; font-variant-numeric: tabular-nums; }
    .spacer { flex: 1; }
    button {
      font: inherit; cursor: pointer; border-radius: 999px;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      padding: 6px 14px; transition: background .12s, border-color .12s;
    }
    button:hover { border-color: var(--accent-dim); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.primary:disabled { opacity: .4; cursor: not-allowed; }

    .controls {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin: 14px 2px 0;
    }
    .cadence { display: flex; flex-direction: column; gap: 6px; }
    .ctl-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .intervals { display: flex; gap: 5px; flex-wrap: wrap; }
    .intervals button { padding: 7px 11px; font-size: 14px; min-width: 40px; }
    .intervals button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    .btn-secondary { background: var(--panel); padding: 8px 14px; font-size: 14px; }
    .btn-secondary:hover { border-color: var(--accent-dim); color: var(--text); }
    /* On narrow screens the Bulk import button wraps below the interval row;
       give it explicit spacing (flex gap isn't reliable cross-axis on older iOS). */
    @media (max-width: 520px) {
      #importToggle { margin-top: 12px; }
      /* Import panel: split choice on its own full row, file picker next,
         then the count + action buttons on a clean bottom row. */
      .split-group { flex-basis: 100%; }
      .import-bar .spacer { flex-basis: 100%; height: 0; margin: 0; }
      .import-bar button { padding: 8px 16px; font-size: 14px; }
      /* Queued posts on mobile: stack (align-items:stretch makes children —
         incl. the edit textarea — full width) and hide the action bar until
         the row is tapped, then reveal it spread evenly across the full width. */
      .item { flex-direction: column; align-items: stretch; }
      .item .body { width: 100%; } /* ensure text + edit textarea span the row */
      .item.queued .body { cursor: pointer; }
      .item.queued .item-actions { display: none; }
      .item.queued.expanded .item-actions {
        display: flex; width: 100%; gap: 8px;
        margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
      }
      .item.queued.expanded .item-actions .iconbtn {
        flex: 1; border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 0; font-size: 18px;
      }
      .item.queued.expanded .item-actions .iconbtn.send { border-color: var(--accent-dim); }
    }
    .import-panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; margin-top: 8px;
    }
    .import-panel textarea {
      width: 100%; min-height: 120px; resize: vertical;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font: inherit; padding: 8px; outline: none;
    }
    .import-panel textarea:focus { border-color: var(--accent-dim); }
    .import-bar { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
    .split-group { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
    .split-options { display: flex; align-items: center; gap: 16px; flex-wrap: nowrap; }
    .split-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .import-bar .split { font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }
    .file-label { font-size: 12px; color: var(--accent); cursor: pointer; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; }
    .file-label:hover { border-color: var(--accent-dim); }
    .import-bar .count.over { color: var(--danger); }
    .import-bar button { padding: 5px 14px; font-size: 13px; }

    .next-line { font-size: 12px; color: var(--muted); margin: 14px 2px 8px; }
    .next-line b { color: var(--text); font-weight: 600; }

    .list { display: flex; flex-direction: column; gap: 8px; }
    .list[hidden] { display: none; } /* author display:flex would otherwise beat [hidden] */
    .item {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;
    }
    .item.next { border-color: var(--accent-dim); box-shadow: 0 0 0 1px var(--accent-dim) inset; }
    .item .body { flex: 1; min-width: 0; }
    .item .txt { white-space: pre-wrap; word-wrap: break-word; }
    .item .meta { font-size: 11px; color: var(--muted); margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
    .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); }
    .badge.next { color: var(--accent); border-color: var(--accent-dim); }
    .badge.posted { color: var(--ok); border-color: #1f5c3a; }
    .badge.failed { color: var(--danger); border-color: #5c2a2c; }
    /* Desktop: compact icon buttons on the right, vertically centered in the row. */
    .item-actions { display: flex; gap: 2px; align-items: center; align-self: center; }
    .iconbtn { color: var(--muted); border: 0; background: transparent; padding: 2px 6px; font-size: 15px; line-height: 1; }
    .iconbtn:hover:not(:disabled) { color: var(--text); }
    .iconbtn:disabled { opacity: .25; cursor: default; }
    .iconbtn.send { color: var(--accent); }
    .iconbtn.send:hover { color: #fff; }
    .del:hover:not(:disabled) { color: var(--danger); }
    .edit-area {
      display: block; width: 100%; min-height: 92px; resize: vertical;
      background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font: inherit; font-size: 16px; padding: 8px; outline: none;
    }
    .edit-area:focus { border-color: var(--accent-dim); }
    .edit-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .edit-bar .spacer { flex: 1; }
    .edit-bar button { padding: 4px 12px; font-size: 13px; }

    .section-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 26px 2px 10px; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 22px 0 12px; }
    .tab { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 9px 14px; font-size: 15px; margin-bottom: -1px; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .empty { color: var(--muted); font-size: 14px; padding: 24px 4px; text-align: center; }
    /* "Load more" tile — same footprint as a post, dashed blue outline that
       (with its text) brightens to the accent on hover. */
    .load-more {
      display: flex; align-items: center; justify-content: center;
      min-height: 62px; padding: 12px 14px;
      background: transparent;
      border: 1px dashed var(--accent-dim); border-radius: 12px;
      color: var(--muted); font-size: 14px;
      cursor: pointer; user-select: none;
      transition: border-color .12s, color .12s;
    }
    .load-more:hover { border-color: var(--accent); color: var(--accent); }
    a { color: var(--accent); }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--border); padding: 8px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55); padding: 24px;
    }
    .modal-overlay[hidden] { display: none; } /* author display:flex would beat [hidden] otherwise */
    .modal-box {
      width: 100%; max-width: 380px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .modal-title { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
    .modal-body {
      margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.45;
      white-space: pre-wrap; word-wrap: break-word;
      max-height: 40vh; overflow-y: auto;
    }
    .modal-body.quote {
      color: var(--text); background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-actions button { padding: 8px 16px; font-size: 14px; }
    .modal-actions .danger { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-overlay" id="login" hidden>
    <form class="login-box" id="loginForm">
      <h1 class="logo">xqueue</h1>
      <p class="login-sub">Enter your passphrase to continue</p>
      <input type="password" id="loginInput" autocomplete="current-password"
             placeholder="Passphrase" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button type="submit" class="primary" id="loginBtn">Unlock</button>
      <p class="login-error" id="loginError" hidden></p>
    </form>
  </div>

  <div class="wrap">
    <header>
      <h1 class="logo">xqueue</h1>
      <div class="header-right">
        <span class="usage" id="usage"></span>
        <button class="lockbtn" id="lockBtn" title="Lock (sign out)" aria-label="Lock">🔒 Lock</button>
      </div>
    </header>

    <div class="composer">
      <textarea id="text" placeholder="What's happening? (Enter to queue, Shift+Enter for newline)"></textarea>
      <div class="composer-bottom">
        <span class="count" id="count">0 / 280</span>
        <span class="cost" id="costEst"></span>
        <span class="spacer"></span>
        <button class="btn-secondary" id="postNow">Post now</button>
        <button class="primary" id="add">Queue</button>
      </div>
    </div>

    <div class="controls">
      <div class="cadence">
        <span class="ctl-label" id="cadenceLabel">Interval (whole queue)</span>
        <div class="intervals" id="intervals"></div>
      </div>
      <button id="importToggle" class="btn-secondary">⇪ Bulk import</button>
    </div>

    <div class="import-panel" id="importPanel" hidden>
      <textarea id="importText" placeholder="Paste many posts here — or choose a .txt / .md / .csv file below.&#10;&#10;Separate each post with a blank line (this lets a post span multiple lines)."></textarea>
      <div class="import-bar">
        <div class="split-group">
          <span class="split-label">Separate posts by</span>
          <span class="split-options">
            <label class="split"><input type="radio" name="split" value="blank" checked> blank line</label>
            <label class="split"><input type="radio" name="split" value="line"> one per line</label>
          </span>
        </div>
        <label class="file-label">Choose file<input type="file" id="importFile" accept=".txt,.md,.csv,text/plain" hidden></label>
        <span class="spacer"></span>
        <span class="count" id="importCount">0 posts</span>
        <button id="importCancel">Cancel</button>
        <button class="primary" id="importAdd" disabled>Add all</button>
      </div>
    </div>

    <div class="next-line" id="next"></div>

    <div class="tabs">
      <button class="tab active" id="tabQueue">Queue</button>
      <button class="tab" id="tabHistory">History</button>
    </div>
    <div class="tab-summary" id="tabSummary"></div>
    <div class="list" id="queue"></div>
    <div class="list" id="history" hidden></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modal" hidden>
    <div class="modal-box">
      <p class="modal-title" id="modalTitle"></p>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel">Cancel</button>
        <button class="primary" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const INTERVALS = [1, 3, 6, 9, 12, 24];
    let secret = localStorage.getItem("xqueue_secret") || "";
    let state = null;
    let editingId = null; // id of the queued post currently being edited, or null
    let expandedId = null; // id of the queued post whose actions are revealed (mobile)
    let queueVisible = 50; // how many queued posts to render ("Load more" raises this)
    let historyExtra = []; // older history rows loaded past the first page (Load more)
    let activeTab = "queue"; // which list tab is showing: "queue" | "history"
    // On touch devices there's no Shift key and Return should insert a newline,
    // so we don't hijack Enter to submit — the Queue/Save buttons do that instead.
    const isTouch = window.matchMedia("(pointer: coarse)").matches;

    function showLogin(error) {
      const el = document.getElementById("login");
      el.hidden = false;
      const errEl = document.getElementById("loginError");
      errEl.textContent = error || "";
      errEl.hidden = !error;
      const input = document.getElementById("loginInput");
      input.value = "";
      input.focus();
    }

    function hideLogin() {
      document.getElementById("login").hidden = true;
    }

    // Validate a passphrase by hitting /api/state. On success, unlock + store.
    async function tryUnlock(pass) {
      secret = pass;
      try {
        const res = await fetch("/api/state", {
          headers: { "content-type": "application/json", "x-app-secret": secret },
        });
        if (res.ok) {
          localStorage.setItem("xqueue_secret", secret);
          state = await res.json();
          hideLogin();
          render();
          return true;
        }
        const data = await res.json().catch(() => ({}));
        secret = "";
        localStorage.removeItem("xqueue_secret");
        showLogin(data.error || "Incorrect passphrase.");
        return false;
      } catch (e) {
        secret = "";
        showLogin("Connection error — try again.");
        return false;
      }
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: { "content-type": "application/json", "x-app-secret": secret, ...(opts.headers || {}) },
      });
      if (res.status === 401 || res.status === 429) {
        const data = await res.json().catch(() => ({}));
        localStorage.removeItem("xqueue_secret");
        secret = "";
        showLogin(data.error || "Session ended — sign in again.");
        throw new Error("unauthorized");
      }
      return res.json();
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    // Custom confirm modal (replaces the native confirm()). Returns a Promise<bool>.
    // Confirm resolves true; Cancel / backdrop click / Escape resolve false.
    function confirmDialog(opts = {}) {
      return new Promise((resolve) => {
        const overlay = document.getElementById("modal");
        const confirmBtn = document.getElementById("modalConfirm");
        const cancelBtn = document.getElementById("modalCancel");
        document.getElementById("modalTitle").textContent = opts.title || "Are you sure?";
        const bodyEl = document.getElementById("modalBody");
        bodyEl.textContent = opts.body || "";
        bodyEl.className = "modal-body" + (opts.quote ? " quote" : "");
        confirmBtn.textContent = opts.confirmLabel || "Confirm";
        confirmBtn.className = opts.danger ? "danger" : "primary";
        cancelBtn.textContent = opts.cancelLabel || "Cancel";

        function onKey(e) {
          if (e.key === "Escape") close(false);
          if (e.key === "Enter") close(true);
        }
        function close(result) {
          overlay.hidden = true;
          confirmBtn.onclick = cancelBtn.onclick = overlay.onclick = null;
          document.removeEventListener("keydown", onKey);
          resolve(result);
        }
        confirmBtn.onclick = () => close(true);
        cancelBtn.onclick = () => close(false);
        overlay.onclick = (e) => { if (e.target === overlay) close(false); };
        document.addEventListener("keydown", onKey);

        overlay.hidden = false;
        confirmBtn.focus();
      });
    }

    function fmtWhen(ms) {
      if (!ms) return "";
      const d = new Date(ms);
      return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    function fmtCountdown(ms) {
      const diff = ms - Date.now();
      if (diff <= 0) return "now";
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      return h > 0 ? `in ${h}h ${m}m` : `in ${m}m`;
    }

    // Grow a textarea to fit its content so all text is visible without scrolling.
    function autoGrow(ta) {
      ta.style.height = "auto";
      ta.style.height = ta.scrollHeight + "px";
    }

    function fmtRunway(days) {
      if (!isFinite(days) || days <= 0) return "0 day";
      if (days < 1) return Math.max(1, Math.round(days * 24)) + "h";
      const val = days < 10
        ? (Math.round(days * 10) / 10).toString().replace(/\.0$/, "")
        : String(Math.round(days));
      return val + " day"; // attributive ("14 day runway"), always singular
    }

    // Cost helpers (X prices in USD; we display AUD via the cron-cached rate).
    function fxRate() { return state && state.fx_usd_aud ? state.fx_usd_aud : 1.44; }
    function aud(usd, dp = 2) { return "A$" + (Number(usd || 0) * fxRate()).toFixed(dp); }
    function textHasLink(t) {
      return /(https?:\/\/|www\.)\S+/i.test(t) ||
        /\b[a-z0-9-]+\.(com|net|org|io|co|ai|app|dev|xyz|me|gg|so|to|tv|info|link|page|site|news|blog|store|shop)\b/i.test(t);
    }

    function render() {
      if (!state) return;
      const scrollY = window.scrollY; // preserve position across the list rebuild

      // Interval selector — purely the queue's drain cadence (global).
      const box = document.getElementById("intervals");
      box.innerHTML = "";
      INTERVALS.forEach((h) => {
        const b = document.createElement("button");
        b.textContent = h + "h";
        b.title = "Queue drains every " + h + " hour" + (h > 1 ? "s" : "");
        if (h === state.interval_hours) b.classList.add("active");
        b.onclick = async () => {
          state = await api("/api/interval", { method: "POST", body: JSON.stringify({ hours: h }) });
          render();
        };
        box.appendChild(b);
      });

      // Usage + next line
      document.getElementById("usage").textContent = `${state.count24h}/${state.daily_cap} posted (24h)`;
      const nextEl = document.getElementById("next");
      if (state.queued.length) {
        const capped = state.count24h >= state.daily_cap;
        nextEl.innerHTML = capped
          ? `Daily cap reached — next post <b>after older posts age out</b>. Interval: every ${state.interval_hours}h.`
          : `Next post <b>${fmtCountdown(state.next_eligible_at)}</b> &middot; every ${state.interval_hours}h`;
      } else {
        nextEl.innerHTML = `Queue is empty &middot; every ${state.interval_hours}h`;
      }

      // Queue (oldest first = next to post at top)
      const q = document.getElementById("queue");
      q.innerHTML = "";
      if (!state.queued.length) {
        q.innerHTML = '<div class="empty">Nothing queued. Type above and hit Enter.</div>';
      }
      state.queued.slice(0, queueVisible).forEach((item, i) => {
        const el = document.createElement("div");
        el.className = "item queued" + (i === 0 ? " next" : "") + (item.id === expandedId ? " expanded" : "");

        if (item.id === editingId) {
          // Inline edit form. Auto-refresh is paused while editing (see refresh()).
          const ta = document.createElement("textarea");
          ta.className = "edit-area";
          ta.value = item.text;
          const bar = document.createElement("div");
          bar.className = "edit-bar";
          const cnt = document.createElement("span");
          cnt.className = "count";
          const save = document.createElement("button");
          save.className = "primary";
          save.textContent = "Save";
          const cancel = document.createElement("button");
          cancel.textContent = "Cancel";
          const setCnt = () => {
            const n = ta.value.length;
            cnt.textContent = `${n} / 280`;
            cnt.classList.toggle("over", n > 280);
            save.disabled = n === 0 || n > 280;
          };
          ta.addEventListener("input", () => { setCnt(); autoGrow(ta); });
          ta.addEventListener("keydown", (e) => {
            if (!isTouch && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); save.click(); }
            if (e.key === "Escape") { e.preventDefault(); cancel.click(); }
          });
          save.onclick = () => saveEdit(item.id, ta.value.trim());
          cancel.onclick = () => { editingId = null; render(); };
          bar.append(cnt, document.createElement("span")); // spacer
          bar.lastChild.className = "spacer";
          bar.append(cancel, save);
          const body = document.createElement("div");
          body.className = "body";
          body.append(ta, bar);
          el.appendChild(body);
          q.appendChild(el);
          setCnt();
          autoGrow(ta); // size to fit the full text — no inner scrolling
          ta.focus();
          // Pull the edit box up so the on-screen keyboard doesn't cover it.
          // Deferred so it runs after render()'s scroll-restore and the keyboard opens.
          setTimeout(() => ta.scrollIntoView({ block: "center", behavior: "smooth" }), 120);
          return;
        }

        el.innerHTML = `
          <div class="body">
            <div class="txt"></div>
            <div class="meta">
              ${i === 0 ? '<span class="badge next">next</span>' : `<span>#${i + 1} in line</span>`}
              <span>added ${fmtWhen(item.created_at)}</span>
              <span>· ${aud(item.cost_usd)}${textHasLink(item.text) ? " (link)" : ""}</span>
            </div>
          </div>`;
        el.querySelector(".txt").textContent = item.text;
        // Mobile: tap the post body to reveal/hide its action bar.
        if (isTouch) {
          el.querySelector(".body").addEventListener("click", (e) => {
            if (e.target.closest("button") || e.target.closest("a")) return;
            expandedId = expandedId === item.id ? null : item.id;
            render();
          });
        }
        const controls = document.createElement("div");
        controls.className = "item-actions";

        const up = document.createElement("button");
        up.className = "iconbtn";
        up.textContent = "▲";
        up.title = "Move up";
        up.disabled = i === 0;
        up.onclick = () => moveItem(item.id, "up");

        const down = document.createElement("button");
        down.className = "iconbtn";
        down.textContent = "▼";
        down.title = "Move down";
        down.disabled = i === state.queued.length - 1;
        down.onclick = () => moveItem(item.id, "down");

        const send = document.createElement("button");
        send.className = "iconbtn send";
        send.textContent = "➤";
        send.title = "Post this now";
        send.onclick = () => postQueuedNow(item.id, item.text);

        const edit = document.createElement("button");
        edit.className = "iconbtn";
        edit.textContent = "✎";
        edit.title = "Edit";
        edit.onclick = () => { editingId = item.id; render(); };

        const del = document.createElement("button");
        del.className = "iconbtn del";
        del.textContent = "×";
        del.title = "Delete";
        del.onclick = async () => {
          const ok = await confirmDialog({
            title: "Delete this post?",
            body: item.text,
            quote: true,
            confirmLabel: "Delete",
            danger: true,
          });
          if (!ok) return;
          try {
            expandedId = null;
            state = await api("/api/queue/" + item.id, { method: "DELETE" });
            render();
            toast("Deleted");
          } catch (e) { /* handled in api() */ }
        };
        controls.append(up, down, send, edit, del);
        el.appendChild(controls); // sibling of body: right side on desktop, row below on mobile
        q.appendChild(el);
      });

      // "Load more" tile — reveals the next chunk of queued posts (client-side;
      // the whole queue is already loaded, this just caps how many we render).
      if (state.queued.length > queueVisible) {
        const more = document.createElement("div");
        more.className = "load-more";
        more.textContent = "Load more…";
        more.onclick = () => { queueVisible += 50; render(); };
        q.appendChild(more);
      }

      // History (most recent first)
      const h = document.getElementById("history");
      h.innerHTML = "";
      // Merge the first page (from /api/state) with any older pages pulled in via
      // "Load more", de-duping by id (a fresh post can shift the page boundary).
      const histSeen = new Set();
      const histList = [];
      for (const row of state.history.concat(historyExtra)) {
        if (histSeen.has(row.id)) continue;
        histSeen.add(row.id);
        histList.push(row);
      }
      if (!histList.length) {
        h.innerHTML = '<div class="empty">No posts yet.</div>';
      }
      histList.forEach((item) => {
        const el = document.createElement("div");
        el.className = "item";
        const badge = item.status === "posted"
          ? '<span class="badge posted">posted</span>'
          : '<span class="badge failed">failed</span>';
        const link = item.tweet_id ? ` &middot; <a href="https://x.com/i/web/status/${item.tweet_id}" target="_blank" rel="noopener">view</a>` : "";
        const err = item.error ? ` &middot; ${escapeHtml(item.error).slice(0, 120)}` : "";
        el.innerHTML = `
          <div class="body">
            <div class="txt"></div>
            <div class="meta">${badge}<span>${fmtWhen(item.posted_at || item.created_at)}${item.status === "posted" ? " · " + aud(item.cost_usd) : ""}${link}${err}</span></div>
          </div>`;
        el.querySelector(".txt").textContent = item.text;
        h.appendChild(el);
      });

      // "Load more" tile for history — cursor-paginates the next older page.
      if (histList.length < (state.historyTotal || 0)) {
        const oldest = histList[histList.length - 1];
        const before = oldest ? (oldest.posted_at || oldest.created_at) : Date.now();
        const more = document.createElement("div");
        more.className = "load-more";
        more.textContent = "Load more…";
        more.onclick = () => loadMoreHistory(before);
        h.appendChild(more);
      }

      applyTab(); // update tab labels/counts and which list is visible
      window.scrollTo(0, scrollY); // restore scroll so actions don't jump the page
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function refresh() {
      if (!secret) return; // locked — login page is showing
      if (editingId !== null) return; // don't clobber an in-progress edit
      try {
        state = await api("/api/state");
        render();
      } catch (e) { /* handled in api() */ }
    }

    let loadingHistory = false;
    async function loadMoreHistory(before) {
      if (loadingHistory) return;
      loadingHistory = true;
      try {
        const res = await api("/api/history?before=" + before);
        if (res && res.ok && Array.isArray(res.history)) {
          historyExtra = historyExtra.concat(res.history);
          render();
        }
      } catch (e) { /* handled in api() */ } finally {
        loadingHistory = false;
      }
    }

    async function postQueuedNow(id, text) {
      const ok = await confirmDialog({
        title: "Post to X now?",
        body: text,
        quote: true,
        confirmLabel: "Post now",
      });
      if (!ok) return;
      try {
        const res = await api("/api/queue/" + id + "/post-now", { method: "POST" });
        if (res.ok) {
          expandedId = null;
          state = res;
          render();
          toast("Posted ✅");
        } else {
          toast(res.error || "Post failed");
        }
      } catch (e) { /* handled in api() */ }
    }

    let moving = false; // serialize reorder requests so they can't race in D1
    async function moveItem(id, dir) {
      if (moving) return;
      moving = true;
      try {
        state = await api("/api/queue/" + id + "/move", { method: "POST", body: JSON.stringify({ dir }) });
        render();
      } catch (e) { /* handled in api() */ } finally {
        moving = false;
      }
    }

    function applyTab() {
      document.getElementById("queue").hidden = activeTab !== "queue";
      document.getElementById("history").hidden = activeTab !== "history";
      document.getElementById("tabQueue").classList.toggle("active", activeTab === "queue");
      document.getElementById("tabHistory").classList.toggle("active", activeTab === "history");
      if (state) {
        document.getElementById("tabQueue").textContent = `Queue (${state.queued.length})`;
        const ht = state.historyTotal != null ? state.historyTotal : state.history.length;
        document.getElementById("tabHistory").textContent = `History (${ht})`;

        const summary = document.getElementById("tabSummary");
        if (activeTab === "queue") {
          if (state.queued.length) {
            const perDay = Math.min(24 / state.interval_hours, state.daily_cap);
            const runwayDays = state.queued.length / perDay;
            const empties = new Date(Date.now() + runwayDays * 86400000)
              .toLocaleDateString(undefined, { month: "short", day: "numeric" });
            summary.textContent =
              `~${fmtRunway(runwayDays)} runway (empties ${empties}) · ≈ ${aud(state.queue_estimate_usd)} to send`;
          } else {
            summary.textContent = "";
          }
        } else {
          summary.textContent = `${aud(state.total_spent_usd)} spent so far · ${state.spent_posts || 0} posted`;
        }
      }
    }

    async function saveEdit(id, text) {
      if (!text || text.length > 280) return;
      try {
        const res = await api("/api/queue/" + id, { method: "PATCH", body: JSON.stringify({ text }) });
        if (res.ok) {
          editingId = null;
          state = res;
          render();
          toast("Updated");
        } else {
          toast(res.error || "Failed to update");
        }
      } catch (e) { /* handled in api() */ }
    }

    async function add(immediate) {
      const ta = document.getElementById("text");
      const text = ta.value.trim();
      if (!text) return; // nothing to post/queue
      if (immediate) {
        const ok = await confirmDialog({
          title: "Post to X now?",
          body: text,
          quote: true,
          confirmLabel: "Post now",
        });
        if (!ok) return;
      }
      const q = document.getElementById("add");
      const p = document.getElementById("postNow");
      q.disabled = true; p.disabled = true;
      try {
        const path = immediate ? "/api/post-text" : "/api/queue";
        const res = await api(path, { method: "POST", body: JSON.stringify({ text }) });
        if (res.ok) {
          state = res;
          ta.value = "";
          updateCount();
          render();
          toast(immediate ? "Posted ✅" : "Queued");
        } else {
          toast(res.error || (immediate ? "Post failed" : "Failed to queue"));
        }
      } finally {
        q.disabled = false; p.disabled = false;
      }
    }

    function updateCount() {
      const ta = document.getElementById("text");
      const n = ta.value.length;
      const c = document.getElementById("count");
      c.textContent = `${n} / 280`;
      c.classList.toggle("over", n > 280);
      const disabled = n === 0 || n > 280;
      document.getElementById("add").disabled = disabled;
      document.getElementById("postNow").disabled = disabled;

      // Live cost estimate for the current post (flags links — 13x pricier).
      const costEl = document.getElementById("costEst");
      const link = n > 0 && textHasLink(ta.value);
      const usd = link ? 0.2 : 0.015;
      costEl.textContent = n === 0 ? "" : "· " + aud(usd) + (link ? " · link" : "");
      costEl.classList.toggle("link", link);
    }

    document.getElementById("text").addEventListener("input", updateCount);
    document.getElementById("text").addEventListener("keydown", (e) => {
      if (!isTouch && e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        add(false); // Enter queues; Post now is an explicit click
      }
    });
    document.getElementById("add").addEventListener("click", () => add(false));
    document.getElementById("postNow").addEventListener("click", () => add(true));

    // Queue / History tabs
    document.getElementById("tabQueue").addEventListener("click", () => { activeTab = "queue"; applyTab(); });
    document.getElementById("tabHistory").addEventListener("click", () => { activeTab = "history"; applyTab(); });

    // Adapt the hint to the device: mobile has no Shift+Enter, so guide to the button.
    document.getElementById("text").placeholder = isTouch
      ? "What's happening? Return adds a new line — tap Queue to add it."
      : "What's happening? (Enter to queue, Shift+Enter for newline)";

    // ---- Bulk import ----
    function importSplitMode() {
      const el = document.querySelector('input[name="split"]:checked');
      return el ? el.value : "blank";
    }
    function parseImport(text, mode) {
      const parts = mode === "line" ? text.split(/\r?\n/) : text.split(/\r?\n\s*\r?\n/);
      return parts.map((p) => p.trim()).filter((p) => p.length > 0);
    }
    function updateImportCount() {
      const posts = parseImport(document.getElementById("importText").value, importSplitMode());
      const over = posts.filter((p) => p.length > 280).length;
      const c = document.getElementById("importCount");
      c.textContent = over
        ? `${posts.length} posts · ${over} over 280`
        : `${posts.length} post${posts.length === 1 ? "" : "s"}`;
      c.classList.toggle("over", over > 0);
      document.getElementById("importAdd").disabled = posts.length === 0;
    }
    document.getElementById("importToggle").addEventListener("click", () => {
      const p = document.getElementById("importPanel");
      p.hidden = !p.hidden;
      if (!p.hidden) document.getElementById("importText").focus();
    });
    document.getElementById("importText").addEventListener("input", updateImportCount);
    document.querySelectorAll('input[name="split"]').forEach((r) =>
      r.addEventListener("change", updateImportCount)
    );
    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        document.getElementById("importText").value = String(reader.result || "");
        updateImportCount();
      };
      reader.readAsText(file);
      e.target.value = ""; // allow re-selecting the same file
    });
    document.getElementById("importCancel").addEventListener("click", () => {
      document.getElementById("importText").value = "";
      document.getElementById("importPanel").hidden = true;
      updateImportCount();
    });
    document.getElementById("importAdd").addEventListener("click", async () => {
      const posts = parseImport(document.getElementById("importText").value, importSplitMode());
      if (!posts.length) return;
      const btn = document.getElementById("importAdd");
      btn.disabled = true;
      try {
        const res = await api("/api/queue/bulk", { method: "POST", body: JSON.stringify({ texts: posts }) });
        if (res.ok) {
          state = res;
          let msg = `Added ${res.added}`;
          const skipped = (res.skippedLong || 0) + (res.skippedEmpty || 0);
          if (res.skippedLong) msg += ` · skipped ${res.skippedLong} over 280`;
          document.getElementById("importText").value = "";
          document.getElementById("importPanel").hidden = true;
          updateImportCount();
          render();
          toast(msg);
        } else {
          toast(res.error || "Import failed");
        }
      } finally {
        btn.disabled = false;
      }
    });

    // ---- Login / lock ----
    document.getElementById("lockBtn").addEventListener("click", () => {
      localStorage.removeItem("xqueue_secret");
      secret = "";
      state = null;
      historyExtra = [];
      queueVisible = 50;
      showLogin();
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const val = document.getElementById("loginInput").value.trim();
      if (!val) return;
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "Checking…";
      await tryUnlock(val);
      btn.disabled = false;
      btn.textContent = "Unlock";
    });

    updateCount();
    if (secret) {
      tryUnlock(secret); // validate the stored passphrase; shows login if invalid
    } else {
      showLogin();
    }
    setInterval(refresh, 30000); // keep countdown / usage fresh
  </script>
</body>
</html>
