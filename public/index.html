      const card = document.getElementById("swipeCard");
      const COMMIT_PX = 96;   // distance to accept/reject
      const FLASH_PX = 130;   // green/red only after a deliberate pull
      const AXIS_LOCK = 14;
      const TAP_MAX_MOVE = 8; // must stay under this for edit
      const TAP_MAX_MS = 320; // and under this duration

      function point(e) {
        if (e.touches && e.touches[0]) return e.touches[0];
        if (e.changedTouches && e.changedTouches[0]) return e.changedTouches[0];
        return e;
      }

      function onStart(e) {
        if (swipeBusy || swipeEditing || !currentSwipeItem()) return;
        if (e.target.closest("button") || e.target.closest("textarea")) return;
        const p = point(e);
        swipePointer.active = true;
        swipePointer.id = e.pointerId != null ? e.pointerId : null;
        swipePointer.startX = p.clientX;
        swipePointer.startY = p.clientY;
        swipePointer.lastY = p.clientY;
        swipePointer.startT = Date.now();
        swipePointer.dx = 0;
        swipePointer.dy = 0;
        swipePointer.maxMove = 0;
        swipePointer.axis = null;
        swipePointer.scrollEl = e.target.closest(".card-text");
        card.style.transition = "none";
        if (e.pointerId != null && card.setPointerCapture) {
          try { card.setPointerCapture(e.pointerId); } catch (_) {}
        }
      }

      function onMove(e) {
        if (!swipePointer.active) return;
        if (swipePointer.id != null && e.pointerId != null && e.pointerId !== swipePointer.id) return;
        const p = point(e);
        swipePointer.dx = p.clientX - swipePointer.startX;
        swipePointer.dy = p.clientY - swipePointer.startY;
        const adx = Math.abs(swipePointer.dx);
        const ady = Math.abs(swipePointer.dy);
        swipePointer.maxMove = Math.max(swipePointer.maxMove, adx, ady);
        if (!swipePointer.axis && (adx > AXIS_LOCK || ady > AXIS_LOCK)) {
          swipePointer.axis = adx >= ady ? "x" : "y";
        }
        if (swipePointer.axis === "x") {
          if (e.cancelable) e.preventDefault();
          const rot = swipePointer.dx / 40;
          card.style.transform = `translateX(${swipePointer.dx}px) rotate(${rot}deg)`;
          card.style.opacity = String(Math.max(0.4, 1 - adx / 500));
          // Colour cue only once well past the commit threshold
          card.classList.toggle("flash-ok", swipePointer.dx > FLASH_PX);
          card.classList.toggle("flash-no", swipePointer.dx < -FLASH_PX);
        } else if (swipePointer.axis === "y" && swipePointer.scrollEl) {
          if (e.cancelable) e.preventDefault();
          const dy = p.clientY - swipePointer.lastY;
          swipePointer.scrollEl.scrollTop -= dy;
          swipePointer.lastY = p.clientY;
        }
      }

      function onEnd(e) {
        if (!swipePointer.active) return;
        if (swipePointer.id != null && e.pointerId != null && e.pointerId !== swipePointer.id) return;
        swipePointer.active = false;
        if (e.pointerId != null && card.releasePointerCapture) {
          try { card.releasePointerCapture(e.pointerId); } catch (_) {}
        }
        const dx = swipePointer.dx;
        const adx = Math.abs(dx);
        const elapsed = Date.now() - swipePointer.startT;
        const wasDrag = swipePointer.axis != null || swipePointer.maxMove > TAP_MAX_MOVE;

        if (swipePointer.axis === "x" && adx >= COMMIT_PX) {
          // Continue out from current position — do NOT reset to centre first.
          if (dx > 0) swipeAccept({ fromDx: dx });
          else swipeReject({ fromDx: dx });
          return;
        }

        if (swipePointer.axis === "x") {
          // Mid-swipe change of mind: spring back, never enter edit.
          springCardBack(dx);
          return;
        }

        // Pure tap only: no axis lock, almost no movement, short press.
        const isPureTap =
          !wasDrag &&
          swipePointer.maxMove <= TAP_MAX_MOVE &&
          elapsed <= TAP_MAX_MS;

        if (isPureTap) {
          card.style.transform = "";
          card.style.opacity = "";
          card.classList.remove("flash-ok", "flash-no");
          enterSwipeEdit();
          return;
        }

        // Scroll or long-press with no commit: just reset visuals.
        card.style.transition = "transform .18s ease, opacity .18s ease";
        card.style.transform = "";
        card.style.opacity = "";
        card.classList.remove("flash-ok", "flash-no");
      }

      if (window.PointerEvent) {
        card.addEventListener("pointerdown", onStart);
        card.addEventListener("pointermove", onMove);
        card.addEventListener("pointerup", onEnd);
        card.addEventListener("pointercancel", onEnd);
      } else {
        card.addEventListener("touchstart", onStart, { passive: true });
        card.addEventListener("touchmove", onMove, { passive: false });
        card.addEventListener("touchend", onEnd);
        card.addEventListener("touchcancel", onEnd);
      }
    })();

    // ---- Login / lock ----
    document.getElementById("lockBtn").addEventListener("click", () => {
      localStorage.removeItem("xqueue_secret");
      secret = "";
      state = null;
      historyExtra = [];
      queueVisible = 50;
      if (swipeMode) closeSwipeMode();
      showLogin();
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const val = document.getElementById("loginInput").value.trim();
      if (!val) return;
      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "Checking…";
      await tryUnlock(val);
      btn.disabled = false;
      btn.textContent = "Unlock";
    });

    updateCount();
    if (secret) {
      tryUnlock(secret); // validate the stored passphrase; shows login if invalid
    } else {
      showLogin();
    }
    setInterval(refresh, 30000); // keep countdown / usage fresh
  </script>
</body>
</html>
