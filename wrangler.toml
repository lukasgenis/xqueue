# Cloudflare Worker config for xqueue — a single-user X/Twitter post scheduler.
# This is a Worker with static assets (NOT a Pages project). `wrangler deploy`
# reads this file.
#   - static UI served from ./public via the ASSETS binding
#   - src/index.js handles the /api/* routes AND the scheduled() cron handler
#   - the cron fires every 15 min; the handler respects the interval setting in D1
name = "xqueue"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

# Fires every 15 minutes. The interval toggle (1/3/6/9/12/24h) lives in D1, not
# here — the handler checks elapsed time each run and skips if it's not time yet.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "xqueue"
# After `npx wrangler d1 create xqueue`, paste the printed database_id here.
# Forks must create their own D1 — do not reuse someone else's id.
database_id = "8dcec775-ab8c-444b-91fc-88688952e411"

# Workers AI — Review "Generate" + writing coach (Mistral Small 3.1).
# Free Neurons/day on the CF free tier; usually enough for personal use.
[ai]
binding = "AI"

# Optional vars (uncomment for a public demo that never hits X):
# [vars]
# DEMO = "1"

# Secrets (set with `wrangler secret put NAME`, never committed):
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET  (OAuth 1.0a from X)
#   APP_SECRET                                                (UI passphrase)
# Demo instances only need APP_SECRET (and DEMO=1).
